<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; frame-src https://docs.google.com; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#F4F4F1">
<title>Experts’ First Exam</title>
<meta name="description" content="Experts’ First Exam (EFE): a family of benchmarks built from real expert workflows, measuring where frontier AI agents still fall short.">
<meta property="og:title" content="Experts’ First Exam">
<meta property="og:description" content="A family of benchmarks built from real expert workflows, with the people who do the work.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111214'/%3E%3Ctext x='16' y='22.5' font-family='Arial,sans-serif' font-weight='700' font-size='17' fill='%23FFFFFF' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<style>
/* Fonts (SIL Open Font License): Space Grotesk, Inter, JetBrains Mono — built in, nothing loads from Google. */
__FONTS__
:root{
  --bg:#F4F4F1;--surface:#FFFFFF;--surface2:#F9F9F7;--ink:#111214;--ink2:#3A3D44;--muted:#73767D;--faint:#A6A9AF;
  --line:#E1E0DB;--line2:#EBEAE6;--grid:rgba(17,18,20,.055);
  --anno:#4353FF;--anno-soft:rgba(67,83,255,.09);--accent:#E0531F;--accent-soft:#FCE9E1;
  --lift:0%;--shadow:0 1px 2px rgba(17,18,20,.04),0 12px 32px rgba(17,18,20,.07);
  --head:'Space Grotesk',system-ui,sans-serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0D10;--surface:#15171B;--surface2:#1A1C21;--ink:#EDECE8;--ink2:#C6C5C0;--muted:#979AA2;--faint:#6A6D74;
  --line:#2A2C32;--line2:#202328;--grid:rgba(255,255,255,.05);--anno:#8590FF;--anno-soft:rgba(133,144,255,.12);
  --accent:#FF7547;--accent-soft:#3A1E14;--lift:38%;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#0C0D10;--surface:#15171B;--surface2:#1A1C21;--ink:#EDECE8;--ink2:#C6C5C0;--muted:#979AA2;--faint:#6A6D74;
  --line:#2A2C32;--line2:#202328;--grid:rgba(255,255,255,.05);--anno:#8590FF;--anno-soft:rgba(133,144,255,.12);
  --accent:#FF7547;--accent-soft:#3A1E14;--lift:38%;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--head);font-weight:500;letter-spacing:-.025em}
svg{display:block}
.container{max-width:1220px;margin:0 auto;padding:0 28px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gridbg{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px}
.c{--cc:color-mix(in srgb,var(--c),#fff var(--lift))}

/* announcement bar */
.bar{background:var(--ink);color:var(--bg);font-size:12.5px;text-align:center;padding:8px 44px;position:relative}
.bar a{text-decoration:underline;text-underline-offset:2px;margin-left:10px}
.bar button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:inherit;cursor:pointer;font-size:16px;opacity:.7;padding:4px 8px}

/* header */
.hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.hdr-in{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:500;font-size:15px;line-height:1.1;white-space:nowrap}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}
.logo small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
.navpill{display:flex;align-items:center;gap:2px;margin-left:24px;background:var(--ink);border-radius:999px;padding:4px}
.navpill a{color:color-mix(in srgb,var(--bg) 70%,transparent);font-size:13.5px;padding:6px 14px;border-radius:999px}
.navpill a:hover{color:var(--bg)}
.navpill a.on{background:var(--bg);color:var(--ink)}
.hdr .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;transition:border-color .15s,transform .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.dark:hover{transform:translateY(-1px)}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn.icon{width:38px;padding:0;border-color:transparent;background:transparent}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.menu-btn{display:none}
.mpanel{display:none}

/* hero */
.hero{position:relative;border-bottom:1px solid var(--line2)}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;min-height:640px;align-items:end;padding:56px 0 64px}
.kicker{font-size:15px;color:var(--ink2);margin:0 0 22px;max-width:520px}
.kicker b{display:block;color:var(--accent);font-weight:500}
.h-hero{font-family:var(--head);font-weight:400;font-size:clamp(46px,7.4vw,104px);line-height:.95;letter-spacing:-.045em}
.sub{font-size:17px;color:var(--ink2);max-width:520px;margin:26px 0 0}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.scroll-hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);margin-top:44px}
.art{position:relative;height:560px}
.win{position:absolute;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:4px}
.win .tag,.atag{position:absolute;left:-1px;top:-20px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--anno);color:#fff;padding:3px 7px;white-space:nowrap;line-height:1.2}
.win.sel{outline:1px solid var(--anno);outline-offset:6px}
.term{background:#111214;color:#C9CCD3;font-family:var(--mono);font-size:11.5px;padding:14px 16px;line-height:1.75;border-color:#111214}
.term .p{color:#7C89FF}.term .ok{color:#4CC07F}.term .dim{color:#6A6D74}
.sheet{padding:10px}
.sheet table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:10.5px}
.sheet td{border:1px solid var(--line2);padding:5px 6px;color:var(--muted);height:24px}
.sheet tr.hl td{background:var(--anno-soft);border-color:color-mix(in srgb,var(--anno) 35%,transparent)}
.sheet .bar-s{display:block;height:6px;border-radius:3px;background:var(--line)}
.box{position:absolute;border:1.5px solid var(--anno);background:var(--anno-soft)}
.box .atag{top:-18px;font-size:9.5px;padding:2px 6px}

/* sections */
section.block{padding:88px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.h-sec{font-size:clamp(32px,4.6vw,56px);line-height:1.0;letter-spacing:-.04em;font-weight:400}
.sec-head p{margin:14px 0 0;color:var(--muted);max-width:560px;font-size:16px}
.note{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);padding:5px 10px;background:var(--surface)}
.note::before{content:"";width:6px;height:6px;background:var(--anno)}

/* about + stats */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
.about p{color:var(--ink2);font-size:16px;margin:16px 0 0;max-width:520px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px}
.statc .n{font-family:var(--head);font-size:44px;line-height:1;letter-spacing:-.04em}
.statc .l{color:var(--muted);font-size:14px;margin-top:8px}
.statc.ac .n{color:var(--anno)}

/* badges + art */
.badge{display:inline-grid;place-items:center;min-width:44px;height:24px;padding:0 7px;border-radius:6px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;color:var(--cc);background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 26%,transparent)}
.badge.lg{min-width:62px;height:36px;font-size:13.5px;border-radius:9px}
.thumb{position:relative;color:var(--cc);background-color:var(--surface2);border-bottom:1px solid var(--line2);overflow:hidden}
.thumb svg{width:100%;height:100%}

/* gallery marquee */
.marquee{display:grid;gap:16px;overflow:hidden;padding:24px 0 6px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.mrow{display:flex;width:max-content;animation:slide var(--dur,110s) linear infinite}
.mrow.rev{animation-direction:reverse}
.marquee:hover .mrow,.marquee:focus-within .mrow{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.gcard{position:relative;display:block;width:272px;margin-right:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:transform .2s,box-shadow .2s;flex:none}
.gcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.gcard .ghead{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line2)}
.gcard .thumb{height:132px}
.gcard .gbody{padding:12px 14px 14px}
.gcard .gt{font-size:14px;font-weight:500;line-height:1.35;min-height:38px}
.gcard .gpills{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.gpill{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line2);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.mrow{animation:none;flex-wrap:wrap;width:auto;padding:0 28px;gap:16px 0}.mrow .dup{display:none}.marquee{-webkit-mask-image:none;mask-image:none}}

/* benchmark grid */
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}
.kind{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:16px;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s;width:100%}
.kind:hover{transform:translateY(-2px)}
.kind .k-n{font-family:var(--head);font-size:40px;line-height:1;letter-spacing:-.04em;min-width:64px}
.kind h4{font-size:17px}
.kind p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.kind.core{background:var(--surface);border:1.5px solid var(--ink)}
.kind.joint{background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--accent-soft) 10px 11px);border:1.5px dashed var(--accent)}
.kind.joint .k-n,.kind.joint h4 .star{color:var(--accent)}
.kind.dim{opacity:.45}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{height:38px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 16px;font-size:14px;min-width:220px;margin-left:auto}
.area{margin-bottom:30px}
.area-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.area-head .sq{width:10px;height:10px;background:var(--cc)}
.area-head h3{font-size:18px}
.area-head .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bcard{position:relative;display:flex;align-items:center;gap:12px;padding:15px 14px 15px 16px;border-radius:12px;min-width:0;transition:transform .15s,box-shadow .15s,border-color .15s}
.bcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.bcard .nm{font-weight:500;font-size:14px;line-height:1.3;min-width:0}
.bcard .kt{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:3px 7px;border-radius:5px;white-space:nowrap}
.bcard.core{background:var(--surface);border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--cc)}
.bcard.core .kt{background:var(--ink);color:var(--bg)}
.bcard.joint{background:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--accent) 9%,transparent) 9px 10px),var(--surface2);border:1.5px dashed color-mix(in srgb,var(--accent) 65%,transparent)}
.bcard.joint .kt{color:var(--accent);border:1px solid var(--accent)}
.star{color:var(--accent);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* scoring diagram */
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;color:var(--ink)}
.diagram .mob{display:none}
.dlist{display:none}

/* leaderboard preview */
.lb{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 26px 20px;overflow:hidden}
.lb-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.bars{display:flex;align-items:flex-end;gap:6px;height:220px;margin-top:22px;border-bottom:1px solid var(--line)}
.bars i{flex:1;background:repeating-linear-gradient(180deg,var(--line2) 0 6px,var(--line) 6px 7px);border-radius:4px 4px 0 0;min-width:4px}
.bars i.k{background:var(--anno-soft);outline:1px dashed var(--anno);outline-offset:-1px}
.bwrap{position:relative}
.lb-veil{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:14px 18px;text-align:center;max-width:86%}
.lb-veil b{display:block;font-family:var(--head);font-weight:500;font-size:18px}
.tabs{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line2)}
.tabs span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:999px;color:var(--muted)}
.tabs span.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* feature cards */
.features{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.feat{padding:22px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.feat .num{font-family:var(--mono);font-size:11px;color:var(--anno)}
.feat h4{font-size:19px;margin:10px 0 8px}
.feat p{margin:0;color:var(--muted);font-size:14px}

.cta-band{background:var(--ink);color:var(--bg);border-radius:24px;padding:56px 48px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;position:relative;overflow:hidden}
.cta-band::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.cta-band>*{position:relative}
.cta-band h2{font-size:clamp(30px,4vw,48px);line-height:1.02;letter-spacing:-.04em;font-weight:400;max-width:640px}
.cta-band p{color:color-mix(in srgb,var(--bg) 62%,transparent);margin:12px 0 0}
.cta-band .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}

footer.pf{border-top:1px solid var(--line);padding:48px 0 56px;margin-top:24px;font-size:13.5px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px}
.fgrid h5{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:0 0 12px;font-weight:500}
.fgrid a{display:block;margin-bottom:8px}
.fgrid a:hover{color:var(--ink)}
.wordmark{font-family:var(--head);font-weight:400;font-size:clamp(44px,10vw,132px);letter-spacing:-.05em;line-height:.9;color:var(--ink);margin-top:44px;opacity:.92}

/* benchmark page */
.crumb{display:inline-flex;gap:6px;font-size:13.5px;color:var(--muted);margin-bottom:24px}
.crumb:hover{color:var(--ink)}
.bhead{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px;align-items:end}
.bhead h1{font-weight:400;font-size:clamp(40px,6vw,76px);line-height:.98;letter-spacing:-.045em;margin-top:14px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
.tag.core{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.joint{border:1px dashed var(--accent);color:var(--accent);background:var(--accent-soft)}
.bart{position:relative;margin-top:22px}
.bart .frame{position:relative;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.bart .thumb{height:230px;border:0}
.subnav{position:sticky;top:64px;z-index:20;display:flex;gap:6px;margin:44px 0 0;padding:10px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.bsec{padding:40px 0 8px;scroll-margin-top:130px}
.bsec h2{font-size:28px;margin-bottom:16px}
.ph{position:relative;border:1px dashed var(--line);border-radius:16px;background:var(--surface);padding:22px}
.ph-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--anno);border:1px solid color-mix(in srgb,var(--anno) 40%,transparent);background:var(--anno-soft);padding:2px 7px}
.real{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:22px}
.skel{height:10px;border-radius:5px;background:var(--line2);margin:9px 0}
.paper{display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:start}
.paper .cover{aspect-ratio:3/4;border:1px solid var(--line);background:repeating-linear-gradient(180deg,var(--surface2) 0 14px,var(--line2) 14px 15px);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--faint)}
.paper h3{font-size:21px}
.paper .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tcard{padding:0;overflow:hidden}
.tcard .thumb{height:110px}
.tcard .tin{padding:16px 18px 18px}
.tcard h4{font-size:17px;margin:0 0 8px;line-height:1.3}
.tcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tcard .meta span{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.tcard ol{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:13.5px}
.tax{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tax-dir h4{font-size:16px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{font-size:12.5px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2)}
.cat.sk{color:transparent;min-width:84px;background:var(--line2);border-color:transparent}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.person{display:flex;gap:12px;align-items:center;margin-top:14px}
.av{width:40px;height:40px;border-radius:50%;background:var(--line2);flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.person .nm{font-weight:500;font-size:14px}
.person .rl{font-size:12.5px;color:var(--muted)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px}
.pn a{padding:18px 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.pn a:hover{border-color:var(--ink)}
.pn .r{text-align:right}

/* contribute */
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.card h3{font-size:20px}
ul.rules{margin:12px 0 0;padding-left:18px;color:var(--ink2);font-size:14px;display:grid;gap:6px}
.gform{width:100%;border:0;border-radius:10px;background:#fff;display:block}
.card a:not(.btn){color:var(--anno);text-decoration:underline;text-underline-offset:2px}

/* ---------- responsive ---------- */
@media (max-width:1100px){.bgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.features{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:980px){
  .navpill,.hdr .desk{display:none}
  .menu-btn{display:inline-flex}
  .mpanel{display:none;position:absolute;left:0;right:0;top:64px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:10px 20px 18px}
  .hdr.open .mpanel{display:block}
  .mpanel a{display:flex;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line2);font-family:var(--head);font-size:20px}
  .mpanel a:last-child{border-bottom:0}
  .hero-in{grid-template-columns:1fr;min-height:0;padding:44px 0 40px;gap:36px}
  .art{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:28px 14px;padding-top:20px}
  .art .win{position:relative;left:auto!important;right:auto!important;top:auto!important;width:auto!important}
  .art .win.hide-m{display:none}
  .about{grid-template-columns:1fr;gap:32px}
  .bhead{grid-template-columns:1fr;gap:8px}
  .tgrid{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .diagram .desk{display:none}.diagram .mob{display:block}.dlist{display:grid;gap:10px;margin-top:20px}
}
@media (max-width:760px){
  .container{padding:0 18px}
  section.block{padding:60px 0}
  .bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kinds{grid-template-columns:1fr}
  .toolbar{flex-wrap:wrap}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px;width:calc(100% + 36px)}
  .chips::-webkit-scrollbar{display:none}
  .search{margin-left:0;width:100%;order:-1}
  .team,.tax{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr 1fr}.fgrid>div:first-child{grid-column:1/-1}
  .cta-band{padding:36px 26px}
  .paper{grid-template-columns:1fr}.paper .cover{display:none}
  .pn{grid-template-columns:1fr}
  .bar .long{display:none}
  .gcard{width:236px}.gcard .thumb{height:112px}
  .bars{height:170px;gap:4px}
  .statc .n{font-size:36px}
}
@media (max-width:520px){
  .bgrid{grid-template-columns:1fr 1fr;gap:8px}
  .bcard{flex-direction:column;align-items:flex-start;gap:10px;padding:12px 12px 13px 14px}
  .bcard .kt{position:absolute;top:10px;right:10px;font-size:8.5px;padding:2px 5px}
  .bcard .nm{font-size:13.5px}
  .art .win.sheet{grid-column:1/-1}
  .kind{padding:14px 16px}.kind .k-n{font-size:32px;min-width:48px}
  .lb-veil{padding:10px 14px}.lb-veil b{font-size:15px}
  .features{grid-template-columns:1fr}
  .art{grid-template-columns:1fr 1fr;gap:26px 10px}
  .term{font-size:10px;padding:10px 11px}
  .logo small{display:none}
  .h-hero{font-size:clamp(44px,13vw,64px)}
}

</head>
<body>
<div id="root"></div>
<script>
/* =====================================================================
   SETTINGS: edit these
   ===================================================================== */
const CONFIG = {
  contactEmail: 'efe-team@example.org',  // shown in the footer and as the backup on the Contribute page
  googleFormUrl: '__FORMURL__',
  googleFormHeight: 1100,               // height of the embedded form in pixels
  workspaceUrl: '',                     // link for "Team sign in"; empty = hidden
  announcement: 'Experts’ First Exam is in development'   // top bar text; empty = no bar
};

/* =====================================================================
   PUBLIC DATA (see README for how to fill in papers, tasks, taxonomy, team)
   ===================================================================== */
const DATA = __DATA__;

/* ===================================================================== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US');
const PALETTE=['#2563EB','#7C3AED','#0891B2','#0F766E','#16A34A','#65A30D','#CA8A04','#EA580C','#DC2626','#DB2777','#9333EA','#4F46E5','#0284C7','#78716C'];
const AREA=Object.fromEntries(DATA.areas.map((a,i)=>[a.id,{...a,col:PALETTE[i%PALETTE.length]}]));
const B=DATA.benchmarks, BY=Object.fromEntries(B.map(b=>[b.slug,b]));
const CORE=B.filter(b=>!b.shared), JOINT=B.filter(b=>b.shared);
const cvar=b=>`--c:${AREA[b.area].col}`;
const I={
 moon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
 arrow:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
 menu:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>'
};
const badge=(b,lg)=>`<span class="badge c ${lg?'lg':''}" style="${cvar(b)}">${esc(b.code)}</span>`;
const star=b=>b.shared?'<span class="star" title="Joint benchmark, built with a partner team">*</span>':'';
const PH='<span class="ph-tag">Placeholder</span>';
let filter='all',kind='all',query='';

/* ---------- area illustrations (original line drawings, one per area) ---------- */
const SV=(inner)=>`<svg viewBox="0 0 240 140" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ART={
 fin:()=>{let s='';const h=[[40,70],[55,62],[48,80],[66,58],[60,84],[78,50],[70,76],[88,44],[82,60],[96,38]];h.forEach(([lo,hi],i)=>{const x=24+i*20,up=i%3!==1,t=140-hi,bt=140-(lo+hi)/2-10;s+=`<line x1="${x}" y1="${t-8}" x2="${x}" y2="${140-lo+8}" opacity=".5"/><rect x="${x-5}" y="${Math.min(t,bt)}" width="10" height="${Math.abs(bt-t)+12}" ${up?'fill="currentColor" fill-opacity=".85"':''}/>`});return SV(s+'<path d="M16 96 C60 90 90 80 120 70 S190 50 228 34" stroke-dasharray="4 4" opacity=".7"/>')},
 biz:()=>SV('<path d="M30 20V118H220" opacity=".5"/><path d="M40 108 C90 96 140 60 210 26"/><path d="M40 30 C100 44 150 84 210 110"/><circle cx="126" cy="70" r="5" fill="currentColor"/><path d="M126 70V118M126 70H30" stroke-dasharray="3 4" opacity=".6"/>'),
 soft:()=>{let s='<rect x="18" y="14" width="204" height="112" rx="6" opacity=".5"/><path d="M18 30H222" opacity=".5"/><circle cx="30" cy="22" r="2.5" fill="currentColor"/><circle cx="40" cy="22" r="2.5" fill="currentColor" opacity=".6"/><circle cx="50" cy="22" r="2.5" fill="currentColor" opacity=".3"/>';[[0,70],[1,110],[1,84],[2,60],[2,96],[1,40],[0,52],[1,120]].forEach(([ind,w],i)=>{s+=`<rect x="${34+ind*16}" y="${42+i*10}" width="${w}" height="4" rx="2" fill="currentColor" stroke="none" opacity="${i%3===1?.9:.35}"/>`});return SV(s)},
 sys:()=>{const n=[[40,40],[40,100],[100,26],[100,70],[100,114],[160,48],[160,94],[210,70]];const e=[[0,2],[0,3],[1,3],[1,4],[2,5],[3,5],[3,6],[4,6],[5,7],[6,7]];let s='';e.forEach(([a,b],i)=>{s+=`<line x1="${n[a][0]}" y1="${n[a][1]}" x2="${n[b][0]}" y2="${n[b][1]}" ${[1,6,9].includes(i)?'stroke-width="3"':'opacity=".45"'}/>`});n.forEach(([x,y],i)=>{s+=`<circle cx="${x}" cy="${y}" r="${i===3?8:6}" fill="var(--surface)" ${i===3?'stroke-width="2.4"':''}/>`});return SV(s)},
 tel:()=>SV('<path d="M62 120L80 30L98 120M68 92H92M72 70H88M76 50H84" /><circle cx="80" cy="28" r="4" fill="currentColor"/>'+[18,32,46,60].map(r=>`<path d="M${80+r*0.7} ${28-r*0.7} A${r} ${r} 0 0 1 ${80+r*0.7} ${28+r*0.7}" opacity="${1-r/80}"/>`).join('')+'<rect x="160" y="78" width="22" height="36" rx="4"/><rect x="196" y="58" width="22" height="36" rx="4" opacity=".6"/>'),
 earth:()=>SV('<path d="M20 110 C50 90 70 120 100 104 S150 80 180 96 S220 110 226 100" opacity=".45"/><path d="M30 122 C60 104 80 130 110 116 S160 96 190 110" opacity=".3"/><path d="M14 96 C46 74 70 100 98 88 S146 62 176 78 S214 86 228 76" opacity=".6"/><ellipse cx="128" cy="50" rx="96" ry="22" stroke-dasharray="3 5" opacity=".6"/><rect x="152" y="18" width="14" height="12" fill="currentColor"/><path d="M146 24H134M172 24H184M146 20V28M178 20V28" /><path d="M159 30L150 60" stroke-dasharray="2 4" opacity=".7"/>'),
 hw:()=>{let s='<rect x="76" y="26" width="88" height="88" rx="6"/>';for(let i=0;i<6;i++){const p=38+i*13;s+=`<path d="M${p} 26V12M${p} 114V128M76 ${p}H62M164 ${p}H178" opacity=".55"/>`}[[86,36,30,26],[122,36,32,18],[122,60,32,44],[86,68,30,36]].forEach(([x,y,w,h],i)=>{s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${i===2?'fill="currentColor" fill-opacity=".25"':'opacity=".7"'}/>`});return SV(s+'<path d="M24 40H50V70H62M178 100H200V60H226" opacity=".45"/>')},
 ai:()=>SV('<rect x="26" y="16" width="150" height="98" rx="6" opacity=".55"/><path d="M26 32H176" opacity=".55"/><rect x="40" y="46" width="60" height="10" rx="2" opacity=".5"/><rect x="40" y="66" width="96" height="10" rx="2" opacity=".5"/><rect x="40" y="88" width="40" height="14" rx="3" fill="currentColor" fill-opacity=".25"/><path d="M60 95 C110 120 150 120 190 84" stroke-dasharray="3 5"/><path d="M188 70L206 112L212 96L228 92Z" fill="currentColor"/><circle cx="60" cy="95" r="10" opacity=".4"/><circle cx="60" cy="95" r="16" opacity=".2"/>'),
 rob:()=>SV('<rect x="34" y="112" width="60" height="12" rx="3"/><path d="M64 112V96L104 56L160 62L184 86" stroke-width="5" opacity=".85"/><circle cx="64" cy="96" r="7" fill="var(--surface)"/><circle cx="104" cy="56" r="7" fill="var(--surface)"/><circle cx="160" cy="62" r="6" fill="var(--surface)"/><path d="M184 86L176 100M184 86L198 96"/><rect x="170" y="102" width="34" height="22" stroke-dasharray="4 4" opacity=".7"/>'),
 eng:()=>SV('<path d="M70 52L130 30L190 52L130 74Z"/><path d="M70 52V102L130 124V74M190 52V102L130 124" /><path d="M58 56V108M52 108H64M52 56H64" opacity=".55"/><path d="M76 116L124 132" opacity=".55"/><path d="M96 82h20M106 72v20" opacity=".5"/><circle cx="160" cy="88" r="8" opacity=".6"/>'),
 phys:()=>{let p='M14 112';for(let x=14;x<=228;x+=4){const y=112-70*Math.exp(-((x-80)**2)/180)-44*Math.exp(-((x-150)**2)/320)-26*Math.exp(-((x-200)**2)/90);p+=` L${x} ${y.toFixed(1)}`}return SV(`<path d="M14 116H228" opacity=".4"/><path d="${p}"/>`+[40,62,80,98,122,150,176,200,214].map(x=>{const y=112-70*Math.exp(-((x-80)**2)/180)-44*Math.exp(-((x-150)**2)/320)-26*Math.exp(-((x-200)**2)/90)+((x*7)%9-4);return`<circle cx="${x}" cy="${y.toFixed(1)}" r="2.6" fill="currentColor" opacity=".7"/>`}).join(''))},
 life:()=>{const hex=(cx,cy,r)=>Array.from({length:6},(_,i)=>{const a=Math.PI/3*i+Math.PI/6;return[(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)]});const h1=hex(92,72,26),h2=hex(137,72,26);let s=`<path d="M${h1.map(p=>p.join(' ')).join('L')}Z"/><path d="M${h2.map(p=>p.join(' ')).join('L')}Z"/>`;s+=`<path d="M${h1[3][0]-0} ${h1[3][1]}L50 72M${h2[0][0]} ${h2[0][1]}L178 50M${h2[1][0]} ${h2[1][1]}L178 100" opacity=".7"/>`;[[50,72],[178,50],[178,100]].forEach(([x,y],i)=>{s+=`<circle cx="${x}" cy="${y}" r="7" ${i===1?'fill="currentColor"':'fill="var(--surface)"'}/>`});return SV(s+'<path d="M86 60l12 24M131 60l12 24" opacity=".45"/>')},
 med:()=>SV('<circle cx="104" cy="70" r="54" opacity=".35"/><circle cx="104" cy="70" r="42" opacity=".5"/><path d="M80 52 C90 40 120 40 130 56 S126 92 104 96 S70 84 80 52Z" opacity=".6"/><circle cx="118" cy="60" r="9" fill="currentColor" fill-opacity=".35"/><rect x="104" y="46" width="30" height="28" stroke="var(--anno)" stroke-width="1.6"/><path d="M134 46H186" stroke="var(--anno)" stroke-dasharray="3 3"/><rect x="186" y="38" width="38" height="16" fill="var(--anno)" stroke="none"/>'),
 edu:()=>SV('<rect x="40" y="92" width="120" height="16" rx="3"/><rect x="52" y="74" width="104" height="16" rx="3" opacity=".75"/><rect x="46" y="56" width="96" height="16" rx="3" opacity=".55"/><path d="M178 40L208 28L238 40L208 52Z" fill="currentColor" fill-opacity=".25"/><path d="M192 46V60C200 66 216 66 224 60V46M234 42V64"/><path d="M14 120H226" opacity=".35"/>')
};
const art=(areaId)=>(ART[areaId]||ART.edu)();
const thumb=(b,h)=>`<div class="thumb gridbg c" style="${cvar(b)};${h?`height:${h}px`:''}">${art(b.area)}</div>`;

/* ---------- shared pieces ---------- */
function header(on){
  const L=[['#/','Home','h'],['#/benchmarks','Benchmarks','b'],['#/leaderboard','Leaderboard','l'],['#/contribute','Contribute','c']];
  let bar='';try{bar=CONFIG.announcement&&localStorage.getItem('efe-bar-off')!=='1'?CONFIG.announcement:''}catch(e){bar=CONFIG.announcement}
  return (bar?`<div class="bar"><span>${esc(bar)}</span><span class="long"> · ${B.length} benchmarks under construction</span><a href="#/contribute">Contribute<span class="long"> a task</span> ↗</a><button data-act="barclose" aria-label="Close">×</button></div>`:'')+
  `<header class="hdr" id="hdr"><div class="container hdr-in">
   <a class="logo" href="#/"><span class="logo-mark">E</span><span>Experts’ First Exam<small>A family of expert benchmarks</small></span></a>
   <nav class="navpill" aria-label="Main">${L.map(([h,t,k])=>`<a href="${h}" class="${on===k?'on':''}">${t}</a>`).join('')}</nav>
   <div class="right"><button class="btn icon" data-act="theme" aria-label="Switch light or dark">${I.moon}</button>
    ${CONFIG.workspaceUrl?`<a class="btn sm desk" href="${esc(CONFIG.workspaceUrl)}">Team sign in</a>`:''}
    <a class="btn sm dark desk" href="#/contribute">Get involved</a>
    <button class="btn sm menu-btn" data-act="menu" aria-label="Open menu">${I.menu} Menu</button></div>
   <div class="mpanel">${L.map(([h,t])=>`<a href="${h}">${t}<span>${I.arrow}</span></a>`).join('')}${CONFIG.workspaceUrl?`<a href="${esc(CONFIG.workspaceUrl)}">Team sign in<span>${I.arrow}</span></a>`:''}</div>
  </div></header>`;
}
const foot=()=>`<footer class="pf"><div class="container"><div class="fgrid">
  <div><div class="logo" style="color:var(--ink)"><span class="logo-mark">E</span>Experts’ First Exam</div><p style="margin:14px 0 0;max-width:380px">A family of benchmarks built from real expert workflows, measuring where frontier AI agents still fall short.</p></div>
  <div><h5>Explore</h5><a href="#/benchmarks">Benchmarks</a><a href="#/leaderboard">Leaderboard</a><a href="#/contribute">Contribute a task</a></div>
  <div><h5>Contact</h5><a href="mailto:${esc(CONFIG.contactEmail)}">${esc(CONFIG.contactEmail)}</a></div>
 </div><div class="wordmark">Experts’ First Exam</div></div></footer>`;

/* ---------- hero art: framed "work screens" with annotation tags ---------- */
function heroArt(){
  const g=k=>B.find(b=>b.code===k)||B[0];
  const gpu=g('GPU'),chip=g('CHIP'),fin=g('FIN'),med=g('MED');
  return`<div class="art" aria-hidden="true">
   <div class="win term" style="left:0;top:40px;width:330px"><span class="tag">GPU Engineering · kernel</span>
    <div><span class="p">agent ▸</span> profile kernel <span class="dim">matmul_tiled</span></div>
    <div><span class="p">agent ▸</span> found uncoalesced loads</div>
    <div><span class="p">agent ▸</span> rewrite tile loop, re-run tests</div>
    <div><span class="ok">check ▸</span> stage 3 of 5 passed</div>
    <div class="dim">rubric ▸ 30+ items scored</div></div>
   <div class="win sel" style="right:0;top:0;width:250px"><span class="tag">Chip Design · floorplan</span>${thumb(chip,170)}</div>
   <div class="win sheet" style="left:12%;top:250px;width:300px"><span class="tag">Finance · reconcile</span>
    <table>${[0,1,2,3,4].map(r=>`<tr class="${r===3?'hl':''}">${[0,1,2,3].map(c=>`<td>${r===0?['ACCT','LEDGER','BANK','Δ'][c]:`<span class="bar-s" style="width:${[70,55,80,40,65][(r+c)%5]}%"></span>`}</td>`).join('')}</tr>`).join('')}</table>
    <div class="box" style="left:6px;right:6px;top:82px;height:30px;background:none"><span class="atag">Mismatch</span></div></div>
   <div class="win hide-m" style="right:4%;top:300px;width:210px"><span class="tag">Medical Imaging · scan</span>${thumb(med,150)}</div>
  </div>`;
}

/* ---------- gallery marquee ---------- */
function gallery(){
  const byArea=DATA.areas.map(a=>B.filter(b=>b.area===a.id));const mixed=[];
  for(let k=0;mixed.length<B.length;k++)byArea.forEach(g=>{if(g[k])mixed.push(g[k])});
  const rows=[mixed.filter((_,i)=>i%2===0),mixed.filter((_,i)=>i%2===1)];
  const card=(b,dup)=>{const t=(b.examples&&b.examples[0]&&b.examples[0].title)||b.example;
    return`<a class="gcard ${dup?'dup':''}" href="#/b/${b.slug}" ${dup?'tabindex="-1" aria-hidden="true"':''}><div class="ghead"><span>${esc(AREA[b.area].name)}</span>${badge(b)}</div>${thumb(b)}<div class="gbody"><div class="gt">${esc(t)}</div><div class="gpills"><span class="gpill">${esc(b.name)}${b.shared?' *':''}</span><span class="gpill">30+ rubric items</span></div></div></a>`};
  return`<div class="marquee">${rows.map((r,i)=>`<div class="mrow ${i?'rev':''}" style="--dur:${120+i*20}s">${r.map(b=>card(b)).join('')}${r.map(b=>card(b,1)).join('')}</div>`).join('')}</div>`;
}

/* ---------- benchmark grid ---------- */
function kindCards(){
  const k=(id,cls,n,title,text)=>`<button class="kind ${cls} ${kind!=='all'&&kind!==id?'dim':''}" data-act="kind" data-v="${kind===id?'all':id}" aria-pressed="${kind===id}"><span class="k-n">${n}</span><span><h4>${title}</h4><p>${text}</p></span></button>`;
  return`<div class="kinds">${k('core','core',CORE.length,'EFE Core','Built entirely by the EFE team.')}${k('joint','joint',JOINT.length,'EFE Joint <span class="star">*</span>','Co-built with partner teams who share the benchmark.')}</div>`;
}
function grid(withTools){
  const q=query.trim().toLowerCase();
  const list=B.filter(b=>(filter==='all'||b.area===filter)&&(kind==='all'||(kind==='joint')===b.shared)&&(!q||b.name.toLowerCase().includes(q)||b.code.toLowerCase().includes(q)));
  const tools=withTools?`<div class="toolbar"><div class="chips">${[['all','All areas'],...DATA.areas.map(a=>[a.id,a.name])].map(([k,l])=>`<button class="chip ${filter===k?'on':''}" data-act="filter" data-v="${k}">${esc(l)}</button>`).join('')}</div></div>
    <div class="toolbar"><input class="search" type="search" placeholder="Search ${B.length} benchmarks" value="${esc(query)}" data-input="q" aria-label="Search benchmarks"></div>`:'';
  const groups=DATA.areas.map(a=>({a,items:list.filter(b=>b.area===a.id)})).filter(g=>g.items.length);
  return kindCards()+tools+(groups.length?groups.map(({a,items})=>`<div class="area"><div class="area-head c" style="--c:${AREA[a.id].col}"><span class="sq"></span><h3>${esc(a.name)}</h3><span class="cnt">${items.length}</span></div>
    <div class="bgrid">${items.map(b=>`<a class="bcard c ${b.shared?'joint':'core'}" style="${cvar(b)}" href="#/b/${b.slug}">${badge(b)}<span class="nm">${esc(b.name)}${star(b)}</span><span class="kt">${b.shared?'JOINT *':'CORE'}</span></a>`).join('')}</div></div>`).join('')
    :'<div class="empty">No benchmark matches.</div>');
}

/* ---------- scoring diagram ---------- */
function diagram(){
  const L=[['01','Inputs','The files, tools and context an expert would have.'],['02','Stages','Each step is checked as the agent works.'],['03','Rubric','30+ weighted items give partial credit.'],['04','Verdict','The final output passes or fails.']];
  const win=(x)=>`<g transform="translate(${x},0)"><rect x="0" y="20" width="430" height="380" rx="6" fill="var(--surface2)" stroke="var(--line)"/><path d="M0 52H430" stroke="var(--line)"/><circle cx="18" cy="36" r="4" fill="var(--line)"/><circle cx="32" cy="36" r="4" fill="var(--line)"/><circle cx="46" cy="36" r="4" fill="var(--line)"/>
   <text x="24" y="86" font-family="var(--mono)" font-size="12" fill="var(--muted)">TASK · EFE-CHIP</text>
   <text x="24" y="112" font-family="var(--head)" font-size="19" fill="var(--ink)">Close timing on a failing block</text>
   ${[0,1,2].map(i=>`<rect x="24" y="${134+i*16}" width="${[360,320,250][i]}" height="7" rx="3.5" fill="var(--line)"/>`).join('')}
   ${[0,1,2,3].map(i=>`<rect x="${24+i*98}" y="206" width="86" height="54" rx="4" fill="var(--surface)" stroke="var(--line)"/><rect x="${36+i*98}" y="222" width="${40+i*8}" height="6" rx="3" fill="var(--line)"/><rect x="${36+i*98}" y="236" width="30" height="6" rx="3" fill="var(--line)"/>`).join('')}
   ${[0,1,2,3,4].map(i=>`<rect x="24" y="${294+i*11}" width="${[300,280,330,260,310][i]}" height="6" rx="3" fill="var(--line)"/>`).join('')}
   <rect x="300" y="364" width="106" height="28" rx="14" fill="var(--ink)"/><text x="353" y="383" text-anchor="middle" font-family="var(--sans)" font-size="12" fill="var(--bg)">Submit</text></g>`;
  const boxes=[[16,74,410,98],[16,198,410,66],[16,284,342,62],[292,358,122,38]];
  const ys=[100,190,280,370];
  const desk=`<svg class="desk" viewBox="0 0 1000 410" width="100%" role="img" aria-label="How an EFE task is scored">${win(0)}
    ${boxes.map(([x,y,w,h],i)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--anno-soft)" stroke="var(--anno)" stroke-width="1.5"/><rect x="${x}" y="${y-16}" width="26" height="16" fill="var(--anno)"/><text x="${x+13}" y="${y-4}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="#fff">${L[i][0]}</text>
      <path d="M${x+w} ${y+h/2} C${x+w+80} ${y+h/2} ${560} ${ys[i]} ${600} ${ys[i]}" stroke="var(--anno)" stroke-width="1.2" fill="none"/><circle cx="600" cy="${ys[i]}" r="3.5" fill="var(--anno)"/>
      <text x="620" y="${ys[i]-4}" font-family="var(--head)" font-size="22" fill="var(--ink)">${L[i][1]}</text><text x="620" y="${ys[i]+18}" font-family="var(--sans)" font-size="14" fill="var(--muted)">${L[i][2]}</text>`).join('')}</svg>`;
  const mob=`<svg class="mob" viewBox="0 0 440 410" width="100%" aria-hidden="true">${win(5)}${boxes.map(([x,y,w,h],i)=>`<rect x="${x+5}" y="${y}" width="${w}" height="${h}" fill="var(--anno-soft)" stroke="var(--anno)" stroke-width="1.5"/><rect x="${x+5}" y="${y-18}" width="30" height="18" fill="var(--anno)"/><text x="${x+20}" y="${y-5}" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="#fff">${L[i][0]}</text>`).join('')}</svg>
   <div class="dlist">${L.map(([n,t,d])=>`<div style="display:flex;gap:12px;align-items:flex-start"><span class="atag" style="position:static">${n}</span><div><b style="font-family:var(--head);font-weight:500;font-size:17px">${t}</b><div class="muted" style="font-size:14px">${d}</div></div></div>`).join('')}</div>`;
  return`<div class="diagram">${desk}${mob}</div>`;
}

/* ---------- leaderboard preview ---------- */
function lbPreview(){
  const n=32;const bars=Array.from({length:n},(_,i)=>{const h=Math.round(92-i*2.3-((i*37)%7));return`<i class="${i<3?'k':''}" style="height:${Math.max(12,h)}%"></i>`}).join('');
  return`<div class="lb"><div class="lb-top"><div><div class="eyebrow">Leaderboard · preview</div><h3 style="font-size:24px;margin-top:6px">Every major model, every field</h3></div><div class="tabs"><span class="on">Pass rate</span><span>Rubric score</span><span>By field</span></div></div>
   <div class="bwrap"><div class="bars" aria-hidden="true">${bars}</div>
   <div class="lb-veil"><b>Results arrive with the first release</b><span class="muted" style="font-size:13.5px">We plan to evaluate ${esc(DATA.stats.modelsTarget)} models and agents</span></div></div></div>`;
}

/* ---------- pages ---------- */

    <div class="cta"><a class="btn dark" href="#/benchmarks">Explore the benchmarks ${I.arrow}</a><a class="btn" href="#tasks" data-act="jump" data-v="tasks">See task examples</a></div>

   </div>
   ${heroArt()}
  </div></section>

  <section class="block"><div class="container about">
   <div><div class="eyebrow">About</div><h2 class="h-sec" style="margin-top:12px">Real expert work, judged by experts and scored by rubrics</h2>

    <p>Every task has 30+ weighted rubric items and staged checks, so we see not only whether a model succeeds, but how far it gets.</p></div>

    <div class="statc ac"><div class="n">${B.length}</div><div class="l">benchmarks · ${CORE.length} core, ${JOINT.length} joint</div></div>
    <div class="statc"><div class="n">${DATA.areas.length}</div><div class="l">areas of expertise</div></div>

   </div>
  </div></section>

  <section class="block" id="tasks" style="padding-bottom:40px"><div class="container">
   <div class="sec-head"><div><div class="eyebrow">Task gallery</div><h2 class="h-sec" style="margin-top:12px">Real work, end to end</h2><p>One example from each benchmark. Tap a card to open its page.</p></div><span class="note">Illustrative examples · real tasks coming soon</span></div>

   ${diagram()}
  </div></section>

  <section class="block" style="padding-top:40px"><div class="container">${lbPreview()}</div></section>

  <section class="block" style="padding-top:24px"><div class="container"><div class="cta-band">
   <div><h2>Lead a benchmark, or propose a task in your field.</h2><p>Experts are credited in the benchmark paper and on this site.</p></div>
   <a class="btn" href="#/contribute">Contribute ${I.arrow}</a>

function allPage(){
  return header('b')+`<section class="block gridbg" style="padding:64px 0 40px;border-bottom:1px solid var(--line2)"><div class="container">
   <div class="eyebrow">The EFE benchmarks</div><h1 class="h-sec" style="margin-top:12px">All benchmarks</h1><p class="muted" style="font-size:16px;margin:14px 0 0">${B.length} benchmarks across ${DATA.areas.length} areas. Tap a box above to show only Core or only Joint.</p>
  </div></section>
  <section class="block" style="padding-top:40px"><div class="container"><div id="gridwrap">${grid(true)}</div></div></section>`+foot();
}

function benchPage(slug){
  const b=BY[slug];if(!b)return home();
  const a=AREA[b.area];const i=B.indexOf(b);const prev=B[(i-1+B.length)%B.length],next=B[(i+1)%B.length];
  const secs=[['overview','Overview'],['paper','Paper'],['examples','Task examples'],['taxonomy','Taxonomy'],['team','Team & contributors']];
  const overview=b.description?`<div class="real"><p style="margin:0;font-size:16px;color:var(--ink2)">${esc(b.description)}</p></div>`
    :`<div class="ph">${PH}<p style="margin:12px 0 4px;color:var(--ink2)">A short summary of what <b>${esc(b.name)}</b> covers, who the experts are, and what makes the work hard for AI agents.</p><div class="skel" style="width:92%"></div><div class="skel" style="width:76%"></div></div>`;
  const p=b.paper;
  const paper=`<div class="${p?'real':'ph'} paper"><div class="cover">PDF</div><div>${p?'':PH}
    <h3 style="margin-top:${p?0:12}px">${esc(p&&p.title||`EFE-${b.code}: ${b.name} benchmark`)}</h3>
    <p class="muted" style="margin:6px 0 0">${esc(p&&p.authors||'Authors to be announced')} · ${esc(p&&p.venue||'In preparation')}</p>
    <div class="btns">${[['arXiv',p&&p.arxiv],['PDF',p&&p.pdf],['Code & data',p&&p.code],['BibTeX',p&&p.bibtex]].map(([l,u])=>u?`<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`:`<span class="btn sm" aria-disabled="true">${l}</span>`).join('')}</div></div></div>`;
  const ex=(b.examples&&b.examples.length?b.examples:[{title:b.example}]).slice(0,3);while(ex.length<3)ex.push(null);
  const tasks=`<div class="tgrid">${ex.map((t,k)=>{const real=t&&t.steps;return`<div class="${real?'real':'ph'} tcard">${thumb(b)}<div class="tin"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">${badge(b)}${real?'':PH}</div>
     <h4>${t?esc(t.title):'Example task '+(k+1)}</h4>${real?`<ol>${t.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="meta">${(t.meta||[]).map(m=>`<span>${esc(m)}</span>`).join('')}</div>`
     :`<ol><li>What the expert is given</li><li>The steps the agent must carry out</li><li>How the result is checked</li></ol><div class="meta"><span>stages: –</span><span>rubric: 30+</span><span>split: public</span></div>`}</div></div>`}).join('')}</div>`;
  const tx=b.taxonomy;
  const taxonomy=tx&&tx.length?`<div class="tax">${tx.map(d=>`<div class="real tax-dir"><h4>${esc(d.direction)}<span class="mono muted" style="font-size:11.5px">${d.categories.length}</span></h4><div class="cats">${d.categories.map(c=>`<span class="cat">${esc(c)}</span>`).join('')}</div></div>`).join('')}</div>`
    :`<div class="tax">${[0,1,2,3].map(k=>`<div class="ph tax-dir"><h4>Direction ${k+1}${k?'':PH}</h4><div class="cats">${Array.from({length:6+k%3},()=>'<span class="cat sk">·</span>').join('')}</div></div>`).join('')}</div>
     <p class="muted" style="font-size:13.5px;margin:12px 0 0">Each benchmark is organized into 80–150 task categories, grounded in research papers and industry practice.</p>`;
  const tm=b.team||{};
  const people=(arr,role)=>arr&&arr.length?arr.map(n=>`<div class="person"><span class="av">${esc(String(n).split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span><div><div class="nm">${esc(n)}</div><div class="rl">${role}</div></div></div>`).join('')
    :`<div class="person"><span class="av"></span><div><div class="nm muted">To be announced</div><div class="rl">${role}</div></div></div>`;
  const has=x=>x&&x.length;
  const team=`<div class="team">
    <div class="${has(tm.leads)?'real':'ph'}"><div class="eyebrow">Benchmark lead</div>${people(tm.leads,'Lead')}</div>
    <div class="${has(tm.members)?'real':'ph'}"><div class="eyebrow">${b.shared?'Partner team':'EFE team'}</div>${people(tm.members,b.shared?'Partner':'Team member')}</div>
    <div class="${has(tm.contributors)?'real':'ph'}"><div class="eyebrow">Task contributors</div>${people(tm.contributors,'Contributor')}<a class="btn sm" style="margin-top:16px" href="#/contribute">Become a contributor</a></div></div>`;
  return header('b')+`<section class="gridbg" style="padding:48px 0 0;border-bottom:1px solid var(--line2)"><div class="container">
   <a class="crumb" href="#/benchmarks">← All benchmarks</a>
   <div class="bhead"><div>${badge(b,true)}<div class="eyebrow" style="margin-top:16px">EFE benchmark · ${esc(a.name)}</div><h1>${esc(b.name)}${b.shared?'<span class="star">*</span>':''}</h1>
     <div class="tags">${b.shared?'<span class="tag joint">EFE Joint * · built with a partner team</span>':'<span class="tag core">EFE Core · built by the EFE team</span>'}<span class="tag">Status: ${esc(b.status||'In development')}</span></div></div>
    <div class="bart"><div class="frame"><span class="atag">EFE-${esc(b.code)} · ${esc(a.name)}</span>${thumb(b,230)}</div></div></div>
   <nav class="subnav" aria-label="Sections">${secs.map(([id,l])=>`<button class="chip" data-act="jump" data-v="${id}">${l}</button>`).join('')}</nav>
  </div></section>
  <div class="container" style="padding-bottom:40px">
   <div class="bsec" id="overview"><h2>Overview</h2>${overview}</div>
   <div class="bsec" id="paper"><h2>Paper</h2>${paper}</div>
   <div class="bsec" id="examples"><h2>Task examples</h2>${tasks}</div>
   <div class="bsec" id="taxonomy"><h2>Taxonomy</h2>${taxonomy}</div>
   <div class="bsec" id="team"><h2>Team &amp; contributors</h2>${team}</div>
   <div class="pn"><a href="#/b/${prev.slug}"><div class="eyebrow">← Previous</div><div style="font-weight:500;margin-top:6px">${esc(prev.name)}${star(prev)}</div></a><a class="r" href="#/b/${next.slug}"><div class="eyebrow">Next →</div><div style="font-weight:500;margin-top:6px">${esc(next.name)}${star(next)}</div></a></div>
  </div>`+foot();
}

function leaderboard(){
  return header('l')+`<section class="block gridbg" style="padding:64px 0 40px;border-bottom:1px solid var(--line2)"><div class="container">
   <div class="eyebrow">Leaderboard</div><h1 class="h-sec" style="margin-top:12px">Leaderboard</h1><p class="muted" style="font-size:16px;margin:14px 0 0;max-width:560px">Scores will use public tasks only. Hidden tasks are evaluated privately and never shown.</p>
  </div></section>
  <section class="block" style="padding-top:40px"><div class="container">${lbPreview()}
   <h3 style="font-size:26px;margin:48px 0 16px">How models will be scored</h3>
   <div class="features" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
    <div class="feat"><div class="num">01</div><h4>Pass rate</h4><p>Share of runs where the agent fully completes the task.</p></div>
    <div class="feat"><div class="num">02</div><h4>Rubric score</h4><p>Weighted share of 30+ rubric items met, scored stage by stage (0–100).</p></div>
    <div class="feat"><div class="num">03</div><h4>Versioned releases</h4><p>Scores are tied to a benchmark version so results stay comparable as tasks rotate.</p></div>
   </div></div></section>`+foot();
}

function formLinks(){
  const u=(CONFIG.googleFormUrl||'').trim();if(!u)return null;
  const embeddable=/^https:\/\/docs\.google\.com\/forms\//.test(u);
  return{open:u,embed:embeddable?u.replace(/\/(edit|viewform)?(\?.*)?(#.*)?$/,'/viewform')+'?embedded=true':null};
}
function contribute(){
  const f=formLinks();
  const mail=`<a href="mailto:${esc(CONFIG.contactEmail)}?subject=${encodeURIComponent('EFE task proposal')}">${esc(CONFIG.contactEmail)}</a>`;
  const formCard=f?`<div class="card">
     <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px"><h3>Submit a task proposal</h3><a class="btn sm" href="${esc(f.open)}" target="_blank" rel="noopener">Open in a new tab ↗</a></div>
     <p class="muted" style="font-size:14px;margin:0 0 16px">Describe the workflow first. The EFE team will follow up with the Harbor template.</p>
     ${f.embed?`<iframe class="gform" src="${esc(f.embed)}" style="height:${Number(CONFIG.googleFormHeight)||1100}px" title="EFE task proposal form" loading="lazy">Loading…</iframe>`:`<a class="btn dark" href="${esc(f.open)}" target="_blank" rel="noopener">Open the proposal form ↗</a>`}
     <p class="muted" style="font-size:13px;margin:14px 0 0">Form not loading? Email your proposal to ${mail} instead.</p></div>`
   :`<div class="card"><h3>Submit a task proposal</h3><p class="muted" style="font-size:14px;margin:6px 0 0">Email a short description of the workflow to ${mail}.</p></div>`;
  return header('c')+`<section class="block gridbg" style="padding:64px 0 40px;border-bottom:1px solid var(--line2)"><div class="container">
   <div class="eyebrow">Contribute</div><h1 class="h-sec" style="margin-top:12px">Help build EFE</h1><p class="muted" style="font-size:16px;margin:14px 0 0">Contributors are credited in the benchmark paper and on this site.</p>
  </div></section>
  <section class="block" style="padding-top:40px"><div class="container"><div class="split">${formCard}
    <div style="display:grid;gap:16px;align-content:start">
     ${DATA.seeking.length?`<div class="card"><h3>New fields looking for an expert partner</h3><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${DATA.seeking.map(n=>`<span class="tag joint">${esc(n)}</span>`).join('')}</div></div>`
       :`<div class="card"><h3>Don’t see your field?</h3><p class="muted" style="font-size:14px;margin:8px 0 0">We welcome new fields. Propose one with the form, and tell us what experts in your field do day to day.</p></div>`}
     <div class="card"><h3>What makes a good task</h3><ul class="rules">${DATA.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
    </div></div></div></section>`+foot();
}

/* ---------- router & events ---------- */
function route(){return location.hash||'#/'}
function render(){
  const h=route();let html;
  if(h.startsWith('#/b/'))html=benchPage(decodeURIComponent(h.slice(4)));
  else if(h==='#/benchmarks')html=allPage();
  else if(h==='#/leaderboard')html=leaderboard();
  else if(h==='#/contribute')html=contribute();
  else html=home();
  document.getElementById('root').innerHTML=html;
  const b=h.startsWith('#/b/')&&BY[decodeURIComponent(h.slice(4))];
  document.title=b?`${b.name} · Experts’ First Exam`:'Experts’ First Exam';
}
const refreshGrid=()=>{const w=document.getElementById('gridwrap');if(w)w.innerHTML=grid(route()==='#/benchmarks')};
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/')||!location.hash){render();window.scrollTo(0,0)}});
document.addEventListener('click',e=>{
  const hdr=document.getElementById('hdr');
  if(hdr&&hdr.classList.contains('open')&&!e.target.closest('[data-act=menu]')&&!e.target.closest('.mpanel'))hdr.classList.remove('open');
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,v=a.dataset.v;
  if(act==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('efe-theme',r.dataset.theme)}catch(err){}}
  else if(act==='menu'){hdr.classList.toggle('open')}
  else if(act==='barclose'){try{localStorage.setItem('efe-bar-off','1')}catch(err){}a.parentElement.remove()}
  else if(act==='jump'){e.preventDefault();const el=document.getElementById(v);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(act==='filter'){filter=v;refreshGrid()}
  else if(act==='kind'){kind=v;refreshGrid()}
});
document.addEventListener('input',e=>{if(e.target.dataset.input==='q'){query=e.target.value;const pos=e.target.selectionStart;refreshGrid();const i=document.querySelector('[data-input=q]');if(i){i.focus();i.setSelectionRange(pos,pos)}}});
try{const t=localStorage.getItem('efe-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
render();
</script>
</body>
</html>
