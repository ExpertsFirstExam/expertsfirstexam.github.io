<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#F4F4F3">
<title>Experts’ First Exam</title>
<meta name="description" content="Experts’ First Exam (EFE) tests whether AI agents can finish real work done by human experts, across 46 domains in 14 fields.">
<meta property="og:title" content="Experts’ First Exam">
<meta property="og:description" content="We test whether AI agents can finish real work done by human experts.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B0C0E'/%3E%3Ctext x='16' y='22.5' font-family='Arial,sans-serif' font-weight='700' font-size='17' fill='%23FFFFFF' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<style>
/* Fonts (SIL Open Font License): Inter, JetBrains Mono — built in, nothing loads from Google. */
__FONTS__
:root{
  --bg:#F4F4F3;--glow:#FFFFFF;--surface:#FFFFFF;--surface2:#F8F8F7;--ink:#0B0C0E;--ink2:#26292E;--muted:#55585F;--faint:#7E8188;
  --line:#D9D9D5;--line2:#E4E4E1;--accent:#C2410C;--accent-soft:#FBE7DC;--lift:0%;--deep:12%;--anno:#3B4BF0;--anno-soft:rgba(59,75,240,.07);
  --shadow:0 1px 2px rgba(11,12,14,.05),0 14px 34px -10px rgba(11,12,14,.16);
  --tile-bg:linear-gradient(180deg,#FFFFFF,#F1F1EF);--tile-sh:0 1px 1px rgba(0,0,0,.04),0 14px 26px -10px rgba(0,0,0,.22),inset 0 1px 0 #fff;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0C0E;--glow:#1A1C21;--surface:#141619;--surface2:#191B1F;--ink:#EDEDEA;--ink2:#D2D2CE;--muted:#A6A9B0;--faint:#7A7D84;
  --line:#2C2F35;--line2:#212429;--accent:#FF8A5C;--accent-soft:#3A1E14;--lift:30%;--deep:0%;--anno:#8C97FF;--anno-soft:rgba(140,151,255,.1);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -10px rgba(0,0,0,.6);
  --tile-bg:linear-gradient(180deg,#22252A,#18191D);--tile-sh:0 1px 1px rgba(0,0,0,.3),0 14px 26px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);}}
:root[data-theme="dark"]{
  --bg:#0B0C0E;--glow:#1A1C21;--surface:#141619;--surface2:#191B1F;--ink:#EDEDEA;--ink2:#D2D2CE;--muted:#A6A9B0;--faint:#7A7D84;
  --line:#2C2F35;--line2:#212429;--accent:#FF8A5C;--accent-soft:#3A1E14;--lift:30%;--deep:0%;--anno:#8C97FF;--anno-soft:rgba(140,151,255,.1);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -10px rgba(0,0,0,.6);
  --tile-bg:linear-gradient(180deg,#22252A,#18191D);--tile-sh:0 1px 1px rgba(0,0,0,.3),0 14px 26px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;letter-spacing:-.025em;font-weight:600}
svg{display:block}
:focus-visible{outline:2px solid var(--anno);outline-offset:2px;border-radius:6px}
[id]{scroll-margin-top:84px}
.container{max-width:1180px;margin:0 auto;padding:0 28px}
.muted{color:var(--muted)}
.code{font-family:var(--mono);font-size:12.5px}
.eyebrow{font-size:13px;font-weight:500;color:var(--muted)}
.fc{--fcl:color-mix(in srgb,var(--fc),#fff var(--lift));--fct:color-mix(in srgb,var(--fcl),#000 var(--deep))}
.star{color:var(--accent);font-weight:700;margin-left:1px}

/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;transition:background .2s,border-color .2s;border-bottom:1px solid transparent}
.hdr.solid,.hdr.open{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line2)}
.hdr-in{display:flex;align-items:center;gap:20px;height:64px;max-width:1280px;margin:0 auto;padding:0 28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap;letter-spacing:-.01em}
.logo-mark{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.logo .lsub{color:var(--muted);font-weight:400}
.nav{display:flex;gap:30px;margin:0 auto;font-size:14.5px;color:var(--ink2)}
.nav a:hover,.nav a.on{color:var(--ink)}
.nav a.on{font-weight:600}
.right{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14.5px;font-weight:500;white-space:nowrap;transition:transform .15s,border-color .15s}
.btn:hover{border-color:var(--ink2)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.dark:hover{transform:translateY(-1px)}
.btn.lg{height:48px;padding:0 24px;font-size:15.5px}
.btn.icon{width:40px;padding:0;border-color:transparent;background:transparent}
.menu-btn{display:none}
.mpanel{display:none}

/* ---------- hero: a calm wheel of benchmark tiles ---------- */
.hero{position:relative;height:clamp(640px,80vh,670px);overflow:hidden;background:radial-gradient(1100px 720px at 50% 42%,var(--glow) 0%,transparent 70%);user-select:none;-webkit-user-select:none;touch-action:pan-y;
  --R:1000px;--t:90px;--lw:106px;--top:120px}
.ring{position:absolute;left:50%;top:calc(var(--top) + var(--R));width:0;height:0;transform:rotate(var(--rot,0deg));transition:transform 1s cubic-bezier(.22,.72,.2,1)}
.ring.drag{transition:none}
.arc{position:absolute;--Ra:var(--R);left:calc(var(--Ra) * -1);top:calc(var(--Ra) * -1);width:calc(var(--Ra) * 2);height:calc(var(--Ra) * 2);border-radius:50%;pointer-events:none;opacity:.55;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px))}
.tile{position:absolute;left:calc(var(--t) / -2);top:calc(var(--t) / -2);width:var(--t);transform:rotate(var(--a)) translateY(calc(var(--R) * -1));transition:opacity .5s,filter .5s;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
.tface{position:relative;width:var(--t);height:var(--t);border-radius:24%;background:var(--tile-bg);box-shadow:var(--tile-sh),0 3px 0 var(--tcl,var(--tc));display:grid;place-items:center;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.ticon{width:68%;height:68%;border-radius:23%;background:linear-gradient(150deg,color-mix(in srgb,var(--tc),#fff 16%),color-mix(in srgb,var(--tc2),#000 6%));display:grid;place-items:center;color:#fff;font-weight:700;letter-spacing:-.03em;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 6px -2px color-mix(in srgb,var(--tc),transparent 40%)}
.ticon span{font-size:calc(var(--t) * .2)}
.ticon span.l4{font-size:calc(var(--t) * .16)}
.ticon span.l5{font-size:calc(var(--t) * .135)}
.tile.joint .tface::after{content:"*";position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:15px;line-height:24px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tlabel{hyphens:auto;-webkit-hyphens:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center;font-size:12px;line-height:1.3;font-weight:500;color:var(--ink);margin-top:9px;width:var(--lw);margin-left:calc((var(--t) - var(--lw)) / 2);opacity:0;transition:opacity .45s}
.tile.on .tlabel{opacity:1}
.tile:not(.on){opacity:.74;filter:saturate(.8)}
.tile.on .tface{transform:translateY(-6px)}
.tile:hover .tface,.tile:focus-visible .tface{transform:translateY(-10px) scale(1.06)}
.tile:focus-visible .tface{outline:2px solid var(--anno);outline-offset:4px}

.hcopy{position:absolute;left:0;right:0;top:260px;text-align:center;padding:0 24px;pointer-events:none}
.hcopy>*{pointer-events:auto}
.h-hero{font-weight:700;font-size:clamp(40px,6vw,76px);line-height:1;letter-spacing:-.05em;margin:0}
.sub{font-size:17px;color:var(--ink2);max-width:640px;margin:18px auto 0}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.key{margin-top:18px;font-size:13.5px;color:var(--muted)}
.mstrip{display:none}
.hfield{display:flex;justify-content:center;align-items:center;gap:10px;margin:0 0 30px}
.fchip{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px 0 16px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--fcl) 50%,transparent);background:color-mix(in srgb,var(--fc) 10%,var(--surface));box-shadow:var(--shadow);cursor:pointer;font-size:17.5px;white-space:nowrap;transition:border-color .4s,background .4s}
.fchip:hover{border-color:var(--fcl)}
.fchip i{width:12px;height:12px;border-radius:4px;background:var(--fcl);flex:none;transition:background .4s}
.fchip b{font-weight:600;color:var(--fct);transition:color .4s}
.fchip span{color:var(--muted);font-size:15px}
.rbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.rbtn:hover{border-color:var(--ink2)}

/* small preview shown next to a tile */
#tip{position:fixed;z-index:60;width:286px;background:#121316;color:#E9E9E6;border-radius:16px;padding:14px 15px 13px;box-shadow:0 22px 48px -12px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;visibility:hidden}
#tip.show{opacity:1;transform:none;visibility:visible}
#tip .t1{display:flex;align-items:center;gap:10px}
#tip .t1 b{font-size:14px;font-weight:600;line-height:1.25}
#tip .lab{font-size:13px;color:#BCBFC5;margin:12px 0 3px}
#tip h4{font-size:15.5px;line-height:1.3;color:#fff;letter-spacing:-.015em}
#tip .t3{font-size:13px;color:#BCBFC5;margin-top:10px}

/* mini tile icon (used outside the ring) */
.mt{position:relative;flex:none;width:var(--s,36px);height:var(--s,36px);border-radius:27%;background:linear-gradient(150deg,color-mix(in srgb,var(--tc),#fff 16%),color-mix(in srgb,var(--tc2),#000 6%));display:grid;place-items:center;color:#fff;font-weight:700;letter-spacing:-.04em;font-size:max(10.5px,calc(var(--s,36px) * .3));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.mt.l4{font-size:max(10px,calc(var(--s,36px) * .25))}.mt.l5{font-size:max(10px,calc(var(--s,36px) * .21))}

/* tags */
.kt{flex:none;font-size:13px;font-weight:500;line-height:1;padding:5px 8px;border-radius:6px;white-space:nowrap}
.kt.core{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
.kt.joint{color:var(--accent);border:1px solid var(--accent);background:var(--accent-soft)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink2);align-items:center}
.legend span.li{display:inline-flex;align-items:center;gap:8px}

/* sections */
section.block{padding:72px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 28px;margin-bottom:28px;flex-wrap:wrap}
.h-sec{font-size:clamp(30px,4vw,46px);line-height:1.05;letter-spacing:-.045em;font-weight:700}
.sec-head p{margin:10px 0 0;color:var(--muted);max-width:580px;font-size:16px}

/* field explorer */
.ex{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
.flist{display:flex;flex-direction:column;gap:2px;position:sticky;top:84px}
.flist::before{content:"";position:absolute;left:17px;top:24px;bottom:24px;width:2px;border-radius:2px;background:var(--thread);opacity:.4}
.frow{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;text-align:left;font-size:15px;color:var(--ink2);transition:background .2s,color .2s;scroll-margin-top:80px}
.frow i{position:relative;width:12px;height:12px;border-radius:4px;background:var(--fcl);flex:none;box-shadow:0 0 0 3px var(--bg)}
.frow .n{margin-left:auto;font-size:13px;color:var(--muted)}
.frow:hover{background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--ink)}
.frow:hover i{box-shadow:0 0 0 3px color-mix(in srgb,var(--surface) 70%,var(--bg))}
.frow.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.frow.on i{box-shadow:0 0 0 3px var(--surface)}
.frow.on .n{color:var(--fct)}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fptop{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:20px;align-items:start}
.fptop h3{font-size:27px;letter-spacing:-.035em;margin-top:4px}
.fptop p{margin:8px 0 0;color:var(--ink2);font-size:15.5px}
.fptop .cnt{margin-top:10px;font-size:13.5px;color:var(--muted)}
.ffig{position:relative;height:124px;border-radius:14px;color:var(--fct);background:linear-gradient(color-mix(in srgb,var(--fc) 11%,transparent) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,color-mix(in srgb,var(--fc) 11%,transparent) 1px,transparent 1px) 0 0/24px 24px,color-mix(in srgb,var(--fc) 8%,var(--surface2));overflow:hidden}
.ffig svg{width:100%;height:100%}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:20px}
.dcard{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;min-width:0;background:var(--surface);border:1px solid var(--line);transition:transform .15s,box-shadow .15s,border-color .15s}
.dcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--faint)}
.dcard .nm{font-size:14.5px;font-weight:500;line-height:1.3;min-width:0;flex:1;overflow-wrap:anywhere}
.bcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:transform .15s,box-shadow .15s,border-color .15s}
.bcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--faint)}
.bcard .nm{font-size:15px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.bcard .exl{grid-column:2 / 4;font-size:13.5px;color:var(--muted);line-height:1.4}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.bgrid.in{margin-top:20px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.exnote{font-size:13.5px;color:var(--muted);margin:14px 0 0}
.tasks{margin-top:22px}
.tasks-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.tasks-h b{font-size:15px;font-weight:600}
.tasks-h span{font-size:13px;color:var(--muted)}
.trow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line2);font-size:15px}
.trow .tt{min-width:0}
.trow .tt small{display:block;color:var(--muted);font-size:13px}
.trow .go{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.trow:hover .go{color:var(--ink)}

/* how a task is scored (home strip) */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.step .n{display:inline-block;font-family:var(--mono);font-size:12px;color:#fff;background:var(--anno);padding:3px 8px;border-radius:5px}
.step h4{font-size:18px;margin:14px 0 6px}
.step p{margin:0;font-size:14.5px;color:var(--muted)}
.scores{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:14px;padding:18px 20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:15px;color:var(--ink2)}
.scores p{margin:0;max-width:760px}

/* scoring diagram (How it works page) */
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px}
.diagram .mob{display:none}
.dlist{display:none}
.dl{display:flex;gap:12px;align-items:flex-start}
.dl b{font-weight:600;font-size:16.5px}
.dl .muted{font-size:15px}
.dex{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--anno-soft);border:1px solid color-mix(in srgb,var(--anno) 30%,transparent);font-size:14.5px;color:var(--ink2);line-height:1.55}
.dex b{font-size:15px}
.atag{font-family:var(--mono);font-size:12px;background:var(--anno);color:#fff;padding:3px 8px;border-radius:5px;line-height:1.2;flex:none}
.cap{font-size:13px;color:var(--muted);margin:14px 0 0}

/* bottom pair */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;position:relative;overflow:hidden}
.pcard.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pcard.dark .eyebrow,.pcard.dark p{color:color-mix(in srgb,var(--bg) 68%,transparent)}
.pcard h3{font-size:25px;letter-spacing:-.035em;font-weight:700;margin-top:8px}
.pcard p{margin:8px 0 0;color:var(--muted)}
.tl{list-style:none;padding:0;margin:18px 0 0}
.tl li{display:grid;grid-template-columns:128px minmax(0,1fr);gap:14px;padding:13px 0;border-top:1px solid var(--line2);font-size:14.5px}
.tl li b{font-weight:600}
.tl .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border-top:1px solid color-mix(in srgb,var(--bg) 18%,transparent)}
.opt b{display:block;font-size:16.5px;font-weight:600}
.opt span{font-size:13.5px;color:color-mix(in srgb,var(--bg) 68%,transparent)}
.opt .ar{width:36px;height:36px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;flex:none;transition:transform .15s}
.opt:hover .ar{transform:translateX(3px)}

/* footer */
footer.pf{border-top:1px solid var(--line);padding:44px 0 36px;font-size:14px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:28px}
.fgrid h5{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink)}
.fgrid ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fgrid a:hover{color:var(--ink)}
.soon{font-size:13px;color:var(--faint);margin-left:4px}
.fbot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px;padding-top:18px;border-top:1px solid var(--line2);font-size:13px}

/* list page */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{height:42px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 18px;font-size:15px;min-width:320px}
.area{margin-bottom:30px}
.area-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.area-head i{width:12px;height:12px;border-radius:4px;background:var(--fcl)}
.area-head h3{font-size:18px}
.area-head .cnt{font-size:13.5px;color:var(--muted)}
.fsel{height:42px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);padding:0 14px;font-size:14.5px;max-width:100%}
.count{font-size:14.5px;color:var(--ink2);margin:-6px 0 18px}
.empty{padding:28px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:14px}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:500}

/* benchmark page */
.page-top{padding:112px 0 0}
.crumb{display:inline-flex;gap:6px;font-size:14px;color:var(--muted);margin-bottom:24px;padding:6px 0}
.crumb:hover{color:var(--ink)}
.bhead h1{font-weight:700;font-size:clamp(38px,5.6vw,66px);line-height:1;letter-spacing:-.05em;margin-top:14px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
.tag.core{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.joint{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.exbox{margin-top:22px;max-width:720px;padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc)}
.exbox small{display:block;font-size:13px;color:var(--muted)}
.exbox b{display:block;font-size:17px;font-weight:600;margin-top:2px}
.subnav{position:sticky;top:64px;z-index:20;display:flex;gap:6px;margin:36px 0 0;padding:10px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line2)}
.subnav::-webkit-scrollbar{display:none}
.bsec{padding:40px 0 8px;scroll-margin-top:130px}
.bsec h2{font-size:26px;margin-bottom:16px;letter-spacing:-.035em}
.ph{position:relative;border:1px dashed var(--line);border-radius:18px;background:var(--surface);padding:22px}
.ph-tag{font-size:12px;color:var(--muted);border:1px solid var(--line);background:var(--surface2);padding:3px 8px;border-radius:6px}
.real{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:22px}
.skel{height:10px;border-radius:5px;background:var(--line2);margin:9px 0}
.paper{display:grid;grid-template-columns:110px 1fr;gap:22px;align-items:start}
.paper .cover{aspect-ratio:3/4;border-radius:8px;border:1px solid var(--line);background:repeating-linear-gradient(180deg,var(--surface2) 0 14px,var(--line2) 14px 15px);display:grid;place-items:center;font-size:12px;color:var(--faint)}
.paper h3{font-size:20px}
.paper .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tcard h4{font-size:16.5px;margin:12px 0 8px;line-height:1.3}
.tcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tcard .meta span{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.tcard ol{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:14px}
.tax{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tax-dir h4{font-size:15.5px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{font-size:13px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2)}
.cat.sk{color:transparent;min-width:84px;background:var(--line2);border-color:transparent}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.person{display:flex;gap:12px;align-items:center;margin-top:14px}
.av{width:40px;height:40px;border-radius:50%;background:var(--line2);flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.person .nm{font-weight:500;font-size:14px}
.person .rl{font-size:13px;color:var(--muted)}
.more{margin-top:56px}
.more h3{font-size:20px;letter-spacing:-.03em;margin-bottom:4px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.pn a{padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.pn a:hover{border-color:var(--ink2)}
.pn .r{text-align:right}

/* generic cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.card h3{font-size:20px;letter-spacing:-.03em}
.card p{margin:8px 0 0;color:var(--ink2)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lead{font-size:17.5px;color:var(--ink2);margin:16px 0 0;max-width:680px}
h2.h2{font-size:28px;letter-spacing:-.04em;margin:56px 0 16px}
ul.rules{margin:12px 0 0;padding-left:20px;color:var(--ink2);font-size:15px;display:grid;gap:6px}
.rtable{width:100%;border-collapse:collapse;font-size:14.5px}
.rtable th{text-align:left;font-weight:500;color:var(--muted);padding:12px 14px;border-bottom:1px solid var(--line)}
.rtable td{padding:22px 14px;color:var(--muted);text-align:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.path h3{font-size:23px;margin-top:12px}
.path .btn{margin-top:20px}
.small{font-size:13.5px;color:var(--muted);margin:12px 0 0}
.small a{text-decoration:underline;text-underline-offset:2px}
ol.next{list-style:none;padding:0;margin:0;counter-reset:n;display:grid;gap:10px}
ol.next li{counter-increment:n;display:flex;gap:14px;align-items:flex-start;font-size:15.5px;color:var(--ink2)}
ol.next li::before{content:counter(n);flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600}
details.more-crit{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:4px 18px}
details.more-crit summary{cursor:pointer;padding:12px 0;font-weight:500;list-style-position:inside}
details.more-crit[open]{padding-bottom:16px}
.nf{min-height:60vh;display:grid;place-items:center;text-align:center;padding:120px 20px 40px}

/* ---------- responsive ---------- */
@media (max-width:1100px){.hero{--R:860px;--t:80px;--lw:92px}}
@media (max-width:900px){
  .nav,.right .desk{display:none}
  .menu-btn{display:inline-flex}
  .hdr.open .mpanel{display:block;position:absolute;left:0;right:0;top:64px;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 24px 18px}
  .mpanel a{display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px solid var(--line2);font-size:19px;font-weight:500;letter-spacing:-.02em}
  .mpanel a:last-child{border-bottom:0}
  .right{margin-left:auto}
  .ex{grid-template-columns:1fr}
  .flist{position:static}.flist::before{display:none}
  .fpanel{margin:6px 0 10px;padding:20px}
  .fptop{grid-template-columns:1fr}.fptop .ffig{display:none}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pair,.g2,.g3,.tgrid{grid-template-columns:1fr}
  .diagram .desk{display:none}.dlist{display:grid;gap:18px}
  .fgrid{grid-template-columns:1fr 1fr}
  .fgrid>div:first-child{grid-column:1 / -1}
}
@media (max-width:640px){
  .container{padding:0 18px}.hdr-in{padding:0 18px}
  .logo .lsub{display:none}
  .hero{height:auto;padding:0 0 8px}
  .ring,.hfield{display:none}
  .hcopy{position:relative;top:auto;padding:116px 18px 24px}
  .h-hero{font-size:44px}
  .sub{font-size:16.5px}
  .cta{flex-direction:column;align-items:stretch;max-width:360px;margin-left:auto;margin-right:auto}
  .mstrip{display:block;height:6px;border-radius:6px;max-width:360px;margin:26px auto 0}
  section.block{padding:52px 0}
  .steps{grid-template-columns:1fr}
  .team,.tax{grid-template-columns:1fr}
  .paper{grid-template-columns:1fr}.paper .cover{display:none}
  .pn{grid-template-columns:1fr}
  .dcards,.bgrid{grid-template-columns:1fr}
  .search{min-width:0;width:100%}
  .chip{min-height:42px}
  .btn{min-height:44px}
  .fgrid ul{gap:2px}.fgrid li a,.fgrid li span{display:inline-block;padding:9px 0}
  .tl li{grid-template-columns:104px minmax(0,1fr)}
  .rtable{font-size:13.5px}.rtable th{padding:10px 8px}.rtable td{padding:18px 8px}
  .scores{padding:16px}
  .trow .gl{display:none}
}
@media (prefers-reduced-motion:reduce){.ring{transition:none}.fpanel{animation:none}}

/* ---------- colors: one spectrum around the wheel ----------
   Fields are spaced evenly around the OKLCH color wheel (which looks even to the eye),
   in the order of data.json, so neighbouring fields have neighbouring colors.
   Each color is darkened just enough for white text on it to reach 4.6:1 contrast.
   Benchmarks inside a field shift slightly toward the next field, so the wheel reads as one gradient. */
const oklchLin=(L,C,h)=>{const r=h*Math.PI/180,a=C*Math.cos(r),b=C*Math.sin(r);
  const l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.291485548*b)**3;

const SLOTS=B.length+NA*GAP;

(()=>{let s=0;DATA.areas.forEach(a=>{const st=s;inArea(a.id).forEach(b=>{ANG[b.slug]=(s+.5)*360/SLOTS;s+=1});CENTER[a.id]=((st+s)/2)*360/SLOTS;s+=GAP})})();

/* one shared "current field" for the wheel and the explorer */
function setField(id,from){
  if(!AREA[id])return;
  cur=id;
  const ring=document.getElementById('ring');
  if(ring){
    let d=((-CENTER[id]-rot)%360+540)%360-180;rot+=d;
    ring.style.setProperty('--rot',rot+'deg');
    ring.querySelectorAll('.tile').forEach(t=>t.classList.toggle('on',BY[t.dataset.tile].area===id));
    const hf=document.getElementById('hfield');hf.style.cssText=fcv(id);document.getElementById('fname').innerHTML=fname(id);
  }
  updateEx(from);hideTip();
}
function step(n){const ids=DATA.areas.map(a=>a.id);setField(ids[(ids.indexOf(cur)+n+ids.length)%ids.length],'hero')}

/* small preview next to a tile (no clicks needed: clicking the tile opens its page) */
function showTip(tile){
  const b=BY[tile.dataset.tile],a=AREA[b.area],p=document.getElementById('tip');
  p.innerHTML=`<div class="t1">${mt(b,36)}<b>${esc(b.name)}</b></div>
   <div class="lab">Example task</div><h4>${esc(exTitle(b))}</h4>
   <div class="t3">${b.shared?'Joint':'Core'} · ${esc(a.name)} · illustrative</div>`;
  const r=tile.querySelector('.tface').getBoundingClientRect(),pw=p.offsetWidth,ph=p.offsetHeight;
  let x=r.left+r.width/2-pw/2,y=r.top-ph-14;
  if(y<72){y=Math.max(72,r.top-8);x=r.right+18;if(x+pw>innerWidth-10)x=r.left-pw-18;
    const fc=document.querySelector('.fchip');const lim=fc?fc.getBoundingClientRect().top-10:1e9;if(y+ph>lim)y=Math.max(66,lim-ph)}
  x=Math.max(10,Math.min(innerWidth-pw-10,x));
  p.style.left=x+'px';p.style.top=y+'px';p.classList.add('show');
}
function hideTip(){const p=document.getElementById('tip');if(p)p.classList.remove('show')}

const REST_MS=260;let exRestT=null;
function bindHero(){
  const hero=document.getElementById('hero'),ring=document.getElementById('ring');if(!hero)return;
  let down=null,moved=false;
  hero.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.target.closest('button,a.btn,.hcopy'))return;down={x:e.clientX,r:rot};moved=false});
  window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x;if(!moved&&Math.abs(dx)<6)return;
    if(!moved){moved=true;hideTip();ring.classList.add('drag')}
    rot=down.r+dx*0.06;ring.style.setProperty('--rot',rot+'deg')});
  window.addEventListener('pointerup',()=>{if(!down)return;const was=moved;down=null;ring.classList.remove('drag');
    if(was){const front=((-rot)%360+360)%360;let best=cur,bd=1e9;DATA.areas.forEach(a=>{const d=Math.abs(((CENTER[a.id]-front)%360+540)%360-180);if(d<bd){bd=d;best=a.id}});setField(best,'hero')}});
  hero.addEventListener('click',e=>{if(moved){e.preventDefault();moved=false}},true);
  ring.addEventListener('mouseover',e=>{const t=e.target.closest('.tile');if(t&&!down&&matchMedia('(hover: hover)').matches)showTip(t)});
  ring.addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('.tile'))hideTip()});
  ring.addEventListener('focusin',e=>{const t=e.target.closest('.tile');if(t)showTip(t)});
  ring.addEventListener('focusout',hideTip);
  hero.addEventListener('keydown',e=>{if(e.target.closest('input'))return;if(e.key==='ArrowRight'){step(1)}else if(e.key==='ArrowLeft'){step(-1)}});
}

   <rect x="296" y="362" width="114" height="30" rx="15" fill="var(--ink)"/><text x="353" y="381.5" text-anchor="middle" font-family="var(--sans)" font-size="12" fill="var(--bg)">Fail · 72 / 100</text></g>`;

      <path d="M${x+w} ${y+h/2} C${x+w+80} ${y+h/2} 560 ${ys[i]} 600 ${ys[i]}" stroke="var(--anno)" stroke-width="1.2" fill="none"/><circle cx="600" cy="${ys[i]}" r="3.5" fill="var(--anno)"/>

    <select class="fsel" data-input="field" aria-label="Field"><option value="all">All fields</option>${DATA.areas.map(a=>`<option value="${a.id}" ${gField===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
    <div class="chips" role="group" aria-label="Show">${[['all','All'],['core','Core'],['joint','Joint *']].map(([k,l])=>`<button class="chip ${gKind===k?'on':''}" data-act="kind" data-v="${k}" aria-pressed="${gKind===k}">${l}</button>`).join('')}</div></div>
   <div id="gridwrap">${grid()}</div>
  </div></section>`+foot();
}

function benchPage(b){
  const a=AREA[b.area];const i=B.indexOf(b);const prev=B[(i-1+B.length)%B.length],next=B[(i+1)%B.length];
  const secs=[['overview','Overview'],['paper','Paper'],['examples','Task examples'],['taxonomy','Taxonomy'],['team','Team & contributors']];
  const overview=b.description?`<div class="real"><p style="margin:0;font-size:16px;color:var(--ink2)">${esc(b.description)}</p></div>`
    :`<div class="ph">${PH}<p style="margin:12px 0 4px;color:var(--ink2)">A short summary of what <b>${esc(b.name)}</b> covers, who the experts are, and what makes the work hard for AI agents.</p><div class="skel" style="width:92%"></div><div class="skel" style="width:76%"></div></div>`;
  const p=b.paper;
  const paper=`<div class="${p?'real':'ph'} paper"><div class="cover">PDF</div><div>${p?'':PH}
    <h3 style="margin-top:${p?0:12}px">${esc(p&&p.title||`EFE-${b.code}: ${b.name}`)}</h3>
    <p class="muted" style="margin:6px 0 0">${esc(p&&p.authors||'Authors to be announced')} · ${esc(p&&p.venue||'In preparation')}</p>
    <div class="btns">${[['arXiv',p&&p.arxiv],['PDF',p&&p.pdf],['Code & data',p&&p.code],['BibTeX',p&&p.bibtex]].map(([l,u])=>u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`:`<span class="btn" aria-disabled="true">${l}</span>`).join('')}</div></div></div>`;
  const ex=(b.examples&&b.examples.length?b.examples:[{title:b.example}]).slice(0,3);while(ex.length<3)ex.push(null);
  const tasks=`<div class="tgrid">${ex.map((t,k)=>{const real=t&&t.steps;return`<div class="${real?'real':'ph'} tcard"><div style="display:flex;justify-content:space-between;align-items:center">${mt(b,38)}${real?'':PH}</div>
     <h4>${t?esc(t.title):'Example task '+(k+1)}</h4>${real?`<ol>${t.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="meta">${(t.meta||[]).map(m=>`<span>${esc(m)}</span>`).join('')}</div>`
     :`<ol><li>What the expert is given</li><li>The steps the agent must carry out</li><li>How the result is checked</li></ol><div class="meta"><span>stages: –</span><span>rubric: 30+</span><span>split: public</span></div>`}</div>`}).join('')}</div>`;
  const tx=b.taxonomy;
  const taxonomy=tx&&tx.length?`<div class="tax">${tx.map(d=>`<div class="real tax-dir"><h4>${esc(d.direction)}<span class="muted" style="font-size:12.5px">${d.categories.length}</span></h4><div class="cats">${d.categories.map(c=>`<span class="cat">${esc(c)}</span>`).join('')}</div></div>`).join('')}</div>`
    :`<div class="tax">${[0,1,2,3].map(k=>`<div class="ph tax-dir"><h4>Direction ${k+1}${k?'':PH}</h4><div class="cats">${Array.from({length:6+k%3},()=>'<span class="cat sk">·</span>').join('')}</div></div>`).join('')}</div>
     <p class="muted" style="font-size:14px;margin:12px 0 0">Each domain is organized into 80–150 task categories, grounded in research papers and industry practice.</p>`;
  const tm=b.team||{};const has=x=>x&&x.length;
  const people=(arr,role)=>has(arr)?arr.map(n=>`<div class="person"><span class="av">${esc(String(n).split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span><div><div class="nm">${esc(n)}</div><div class="rl">${role}</div></div></div>`).join('')
    :`<div class="person"><span class="av"></span><div><div class="nm muted">To be announced</div><div class="rl">${role}</div></div></div>`;
  const team=`<div class="team">
    <div class="${has(tm.leads)?'real':'ph'}"><div class="eyebrow">Domain lead</div>${people(tm.leads,'Lead')}</div>
    <div class="${has(tm.members)?'real':'ph'}"><div class="eyebrow">${b.shared?'Partner team':'EFE team'}</div>${people(tm.members,b.shared?'Partner':'Team member')}</div>
    <div class="${has(tm.contributors)?'real':'ph'}"><div class="eyebrow">Task contributors</div>${people(tm.contributors,'Contributor')}<a class="btn" style="margin-top:16px" href="#/contribute">Become a contributor</a></div></div>`;
  const others=inArea(b.area).filter(x=>x!==b);
  return header('b')+`<section class="page-top"><div class="container">
   <a class="crumb" href="#/domains">← All domains</a>
   <div class="bhead fc" style="${tcv(b)}">${mt(b,60)}<div class="eyebrow" style="margin-top:18px">${esc(a.name)} · <span class="code">EFE-${esc(b.code)}</span></div><h1>${esc(b.name)}</h1>
     <div class="tags">${b.shared?'<span class="tag joint">Joint * · co-built with a partner team</span>':'<span class="tag core">Core · built by the EFE team</span>'}<span class="tag">${esc(b.status||'In development')}</span></div>
     <div class="exbox"><small>Example task · illustrative</small><b>${esc(exTitle(b))}</b></div></div>
   <nav class="subnav" aria-label="Sections">${secs.map(([id,l])=>`<button class="chip" data-act="jump" data-v="${id}" data-sec="${id}">${l}</button>`).join('')}</nav>
   <div class="bsec" id="overview"><h2>Overview</h2>${overview}</div>
   <div class="bsec" id="paper"><h2>Paper</h2>${paper}</div>
   <div class="bsec" id="examples"><h2>Task examples</h2>${tasks}</div>
   <div class="bsec" id="taxonomy"><h2>Taxonomy</h2>${taxonomy}</div>
   <div class="bsec" id="team"><h2>Team &amp; contributors</h2>${team}</div>
   <div class="more"><h3>More in ${esc(a.name)}</h3><div class="dcards" style="margin-top:12px">${others.map(dcard).join('')}</div></div>
   <div class="pn"><a href="#/d/${prev.slug}"><div class="eyebrow">← Previous</div><div style="font-weight:500;margin-top:6px">${esc(prev.name)}</div></a><a class="r" href="#/d/${next.slug}"><div class="eyebrow">Next →</div><div style="font-weight:500;margin-top:6px">${esc(next.name)}</div></a></div>
  </div></section><div style="height:64px"></div>`+foot();
}

function howPage(){
  return header('h')+`<section class="page-top"><div class="container">
   <div class="eyebrow">How it works</div><h1 class="h-sec" style="margin-top:10px">Real expert work, scored step by step</h1>
   <p class="lead">Each EFE task is a piece of real work from an expert’s job. An AI agent gets the same inputs the expert would have, does the work, and is scored against a rubric written by experts in that field.</p>
   <div style="margin-top:32px">${diagram()}</div>
   <h2 class="h2">Two scores for every task</h2>
   <div class="g2">
    <div class="card"><h3>Pass or fail</h3><p>Did the agent fully finish the job? Across many tasks, this gives the <b>pass rate</b>.</p></div>
    <div class="card"><h3>Rubric score</h3><p>How much of the work was done right, from 0 to 100. Each of the 30+ rubric items carries a weight, so partial progress counts.</p></div>
   </div>
   <h2 class="h2">Keeping results fair</h2>
   <div class="g2">
    <div class="card"><h3>Public and private tasks</h3><p>Scores include both. Public tasks show anyone how the scoring works. Private tasks are never published, which makes it much less likely that they end up in a model’s training data. They count toward every score.</p></div>
    <div class="card"><h3>Versioned releases</h3><p>Scores are tied to an EFE release, so results stay comparable as tasks are added.</p></div>
   </div>
   <h2 class="h2">What makes a good task</h2>
   <div class="card"><ul class="rules" style="margin:0">${DATA.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
   <div class="scores" style="margin-top:28px"><p>Do you do work like this? Propose a task from your field.</p><a class="btn dark" href="#/contribute">Contribute ${I.arrow}</a></div>
  </div></section><div style="height:72px"></div>`+foot();
}

function results(){
  return header('r')+`<section class="page-top"><div class="container">
   <div class="eyebrow">Leaderboard</div><h1 class="h-sec" style="margin-top:10px">Leaderboard</h1>
   <p class="lead">The first results are planned for <b>${esc(CONFIG.releaseTarget)}</b>, with scores for ${esc(DATA.stats.modelsTarget)} models and agents on every field.</p>
   <div class="card" style="margin-top:32px"><div class="eyebrow" style="margin-bottom:10px">What the leaderboard will show</div><div style="overflow-x:auto">
    <table class="rtable"><thead><tr><th>Model or agent</th><th>Pass rate</th><th>Rubric score</th><th>Fields covered</th></tr></thead>
    <tbody><tr><td colspan="4">No results yet. First release: ${esc(CONFIG.releaseTarget)}.</td></tr></tbody></table></div></div>
   <p class="lead" style="font-size:16px">Each model gets a pass rate and a rubric score, counting both public and private tasks. <a href="#/how" style="text-decoration:underline;text-underline-offset:3px">How scoring works</a></p>
  </div></section><div style="height:72px"></div>`+foot();
}

function contribute(){
  const f=formUrl();const em=esc(CONFIG.contactEmail);
  return header('c')+`<section class="page-top"><div class="container">
   <div class="eyebrow">Contribute</div><h1 class="h-sec" style="margin-top:10px">Help build EFE</h1>
   <p class="lead">EFE is built with the people who do the work. Contributors are credited in the EFE papers and on this site.</p>
   <div class="g2" style="margin-top:32px">
    <div class="card path"><span class="pill">About 5 minutes</span><h3>Propose a task</h3>
     <p>Describe one piece of real work from your job that today’s AI would struggle with. A short description is enough to start.</p>
     ${f?`<a class="btn dark" href="${esc(f)}" target="_blank" rel="noopener">Open the proposal form ${I.ext}</a>`:`<a class="btn dark" href="${mailto('EFE task proposal')}">Email your proposal</a>`}
     <p class="small">Please don’t include confidential information from your employer, clients or patients.</p>
     <p class="small">The form opens in a new tab. Can’t open Google Forms? Email your proposal to <a href="${mailto('EFE task proposal')}">${em}</a>.</p></div>
    <div class="card path" id="lead"><span class="pill">For experts and teams</span><h3>Lead or partner on a domain</h3>
     <p>Lead the domain for your field with the EFE team, as the lead expert or as a partner team.</p>
     <a class="btn" href="${mailto('EFE domain partnership')}">Email us</a>
     <p class="small">Tell us your field and a few lines about your work.</p></div>
   </div>
   <h2 class="h2">What happens next</h2>
   <div class="card"><ol class="next"><li>You send a short proposal.</li><li>We read it and reply by email.</li><li>If it fits, we work with you to turn it into a full task: the inputs, the steps, and a scoring rubric.</li></ol></div>
   <h2 class="h2">What makes a good task</h2>
   <div class="card"><p style="margin:0">To start, we only need a short description of the work, what a good result looks like, and roughly how long it takes an expert. A good final task is:</p>
    <ul class="rules">${DATA.rules.slice(0,4).map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
    <details class="more-crit"><summary>See the full checklist</summary><ul class="rules">${DATA.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></details>
    ${DATA.seeking.length?`<p class="small">Fields looking for an expert partner: ${DATA.seeking.map(esc).join(', ')}.</p>`:`<p class="small">Don’t see your field? Propose it with the same form.</p>`}</div>
  </div></section><div style="height:72px"></div>`+foot();
}

function notFound(){
  return header('')+`<section class="nf"><div><div class="eyebrow">Page not found</div><h1 class="h-sec" style="margin-top:10px">We couldn’t find that page</h1>
   <p class="lead" style="margin-left:auto;margin-right:auto">The link may be out of date.</p>
   <div class="cta"><a class="btn dark" href="#/">Go to the home page</a><a class="btn" href="#/domains">See all domains</a></div></div></section>`+foot();
}

/* ---------- router & events ---------- */
function render(){
  hideTip();
  const h=location.hash||'#/';let html,title='Experts’ First Exam';
  if(!h.startsWith('#/')||h==='#/')html=home();
  else if(h.startsWith('#/d/')||h.startsWith('#/b/')){const b=BY[decodeURIComponent(h.slice(4))];if(b){html=benchPage(b);title=`${b.name} · Experts’ First Exam`}else{html=notFound();title='Page not found · Experts’ First Exam'}}
  else if(h==='#/domains'||h==='#/benchmarks')html=allPage();
  else if(h==='#/how')html=howPage();
  else if(h==='#/leaderboard'||h==='#/results')html=results();
  else if(h==='#/contribute')html=contribute();
  else{html=notFound();title='Page not found · Experts’ First Exam'}
  document.getElementById('root').innerHTML=html;document.title=title;
  bindHero();onScroll();
}
function closeMenu(){const hd=document.getElementById('hdr');if(hd&&hd.classList.contains('open')){hd.classList.remove('open');const b=hd.querySelector('[data-act=menu]');if(b)b.setAttribute('aria-expanded','false')}}
function onScroll(){
  const hd=document.getElementById('hdr');if(hd)hd.classList.toggle('solid',scrollY>8||!document.getElementById('hero'));
  const sn=document.querySelector('.subnav');
  if(sn){let on=null;document.querySelectorAll('.bsec').forEach(s=>{if(s.getBoundingClientRect().top<150)on=s.id});
    sn.querySelectorAll('[data-sec]').forEach(c=>{const a=c.dataset.sec===on;c.classList.toggle('on',a);if(a)c.setAttribute('aria-current','true');else c.removeAttribute('aria-current')})}
}
let lastY=0;
window.addEventListener('scroll',()=>{POS[location.hash||'#/']=scrollY;onScroll();hideTip();if(Math.abs(scrollY-lastY)>30){closeMenu();lastY=scrollY}},{passive:true});
// remember where each page was scrolled, so Back returns to the same spot;
// arriving by clicking a link starts at the top (and with a fresh Domains list)
const POS={};let clickNav=false;
try{history.scrollRestoration='manual'}catch(e){}
window.addEventListener('hashchange',()=>{
  const fresh=clickNav;clickNav=false;
  if(fresh&&(location.hash==='#/domains'||location.hash==='#/benchmarks')){gKind='all';gQuery='';gField='all'}
  render();
  const g=takeJump();if(g){const el=document.getElementById(g);if(el){el.scrollIntoView();return}}
  const y=fresh?0:(POS[location.hash||'#/']||0);
  window.scrollTo(0,y);requestAnimationFrame(()=>window.scrollTo(0,y));
});
let pendingJump=null;function takeJump(){const g=pendingJump;pendingJump=null;return g}
let wasMob=isMob();
window.addEventListener('resize',()=>{hideTip();const m=isMob();if(m!==wasMob){wasMob=m;const w=document.getElementById('exwrap');if(w)w.innerHTML=explorer()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();hideTip()}});
document.addEventListener('click',e=>{
  const hdr=document.getElementById('hdr');
  if(hdr&&hdr.classList.contains('open')&&!e.target.closest('[data-act=menu]'))closeMenu();
  const ln=e.target.closest('a[href^="#/"]');if(ln&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&ln.getAttribute('href')!==(location.hash||'#/')){clickNav=true;POS[location.hash||'#/']=scrollY}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,v=a.dataset.v;
  if(act==='theme'){const r=document.documentElement;r.dataset.theme=isDark()?'light':'dark';try{localStorage.setItem('efe-theme',r.dataset.theme)}catch(err){}
    a.innerHTML=isDark()?I.sun:I.moon;a.setAttribute('aria-label',isDark()?'Switch to light mode':'Switch to dark mode')}
  else if(act==='menu'){const o=hdr.classList.toggle('open');a.setAttribute('aria-expanded',o);lastY=scrollY}
  else if(act==='jump'){const el=document.getElementById(v);if(el){e.preventDefault();el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}}
  else if(act==='goto'){pendingJump=v}
  else if(act==='step'){step(Number(v))}
  else if(act==='ex'){clearTimeout(exRestT);setField(v,'ex')}
  else if(act==='kind'){gKind=v;document.querySelectorAll('[data-act=kind]').forEach(c=>{c.classList.toggle('on',c.dataset.v===v);c.setAttribute('aria-pressed',c.dataset.v===v)});document.getElementById('gridwrap').innerHTML=grid()}
  else if(act==='clear'){gKind='all';gQuery='';gField='all';render()}
});
/* explorer rows: pointing selects only once the mouse rests on a row, so crossing rows on the way to the panel doesn't change it */
document.addEventListener('mousemove',e=>{clearTimeout(exRestT);const r=e.target.closest&&e.target.closest('.frow');
  if(r&&r.dataset.v!==cur&&matchMedia('(hover: hover) and (min-width: 901px)').matches)exRestT=setTimeout(()=>setField(r.dataset.v,'ex'),REST_MS)});
document.addEventListener('input',e=>{const k=e.target.dataset.input;if(k==='q'){gQuery=e.target.value}else if(k==='field'){gField=e.target.value}else return;document.getElementById('gridwrap').innerHTML=grid()});
try{const t=localStorage.getItem('efe-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
render();
</script>
</body>
</html>
