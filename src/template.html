<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data:; frame-src https://docs.google.com; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#F4F4F3">
<title>Experts’ First Exam</title>
<meta name="description" content="Experts’ First Exam (EFE): a family of benchmarks built from real expert workflows, measuring where frontier AI agents still fall short.">
<meta property="og:title" content="Experts’ First Exam">
<meta property="og:description" content="A family of benchmarks built from real expert workflows, with the people who do the work.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B0C0E'/%3E%3Ctext x='16' y='22.5' font-family='Arial,sans-serif' font-weight='700' font-size='17' fill='%23FFFFFF' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<style>
/* Fonts (SIL Open Font License): Inter, JetBrains Mono — built in, nothing loads from Google. */
__FONTS__
:root{
  --bg:#F4F4F3;--glow:#FFFFFF;--surface:#FFFFFF;--surface2:#F8F8F7;--ink:#0B0C0E;--ink2:#3B3E44;--muted:#75787F;--faint:#A9ACB2;
  --line:#E3E3E0;--line2:#ECECE9;--accent:#E0531F;--accent-soft:#FCEBE3;--lift:0%;
  --shadow:0 1px 2px rgba(11,12,14,.05),0 14px 34px -10px rgba(11,12,14,.16);
  --tile-bg:linear-gradient(180deg,#FFFFFF,#F1F1EF);--tile-sh:0 1px 1px rgba(0,0,0,.04),0 14px 26px -10px rgba(0,0,0,.22),inset 0 1px 0 #fff;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0C0E;--glow:#1A1C21;--surface:#141619;--surface2:#191B1F;--ink:#EDEDEA;--ink2:#C6C6C2;--muted:#9699A0;--faint:#64676E;
  --line:#272A2F;--line2:#1F2226;--accent:#FF7A4D;--accent-soft:#3A1E14;--lift:28%;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -10px rgba(0,0,0,.6);
  --tile-bg:linear-gradient(180deg,#22252A,#18191D);--tile-sh:0 1px 1px rgba(0,0,0,.3),0 14px 26px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);}}
:root[data-theme="dark"]{
  --bg:#0B0C0E;--glow:#1A1C21;--surface:#141619;--surface2:#191B1F;--ink:#EDEDEA;--ink2:#C6C6C2;--muted:#9699A0;--faint:#64676E;
  --line:#272A2F;--line2:#1F2226;--accent:#FF7A4D;--accent-soft:#3A1E14;--lift:28%;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 14px 34px -10px rgba(0,0,0,.6);
  --tile-bg:linear-gradient(180deg,#22252A,#18191D);--tile-sh:0 1px 1px rgba(0,0,0,.3),0 14px 26px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;letter-spacing:-.025em;font-weight:600}
svg{display:block}
.container{max-width:1180px;margin:0 auto;padding:0 28px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fc{--fcl:color-mix(in srgb,var(--fc),#fff var(--lift))}

/* header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;transition:background .2s,border-color .2s;border-bottom:1px solid transparent}
.hdr.solid{background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line2)}
.hdr-in{display:flex;align-items:center;gap:20px;height:64px;max-width:1280px;margin:0 auto;padding:0 28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap;letter-spacing:-.01em}
.logo-mark{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px}
.logo .dot{color:var(--faint);font-weight:400}
.nav{display:flex;gap:28px;margin:0 auto;font-size:14px;color:var(--ink2)}
.nav a:hover,.nav a.on{color:var(--ink)}
.nav a.on{font-weight:500}
.right{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 17px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;transition:transform .15s,border-color .15s}
.btn:hover{border-color:var(--ink2)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.dark:hover{transform:translateY(-1px)}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn.icon{width:36px;padding:0;border-color:transparent;background:transparent}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.menu-btn{display:none}
.mpanel{display:none}

/* ---------- hero ring ---------- */
.hero{position:relative;height:clamp(700px,100vh,900px);overflow:hidden;background:radial-gradient(1100px 720px at 50% 42%,var(--glow) 0%,transparent 70%);user-select:none;-webkit-user-select:none;touch-action:pan-y;
  --R:1000px;--t:90px;--lw:106px;--top:126px;max-height:840px}
.ring{position:absolute;left:50%;top:calc(var(--top) + var(--R));width:0;height:0;transform:rotate(var(--rot,0deg));transition:transform 1.1s cubic-bezier(.22,.72,.2,1)}
.ring.drag{transition:none}
.tile{position:absolute;left:calc(var(--t) / -2);top:calc(var(--t) / -2);width:var(--t);transform:rotate(var(--a)) translateY(calc(var(--R) * -1));transition:opacity .5s,filter .5s;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tface{position:relative;width:var(--t);height:var(--t);border-radius:24%;background:var(--tile-bg);box-shadow:var(--tile-sh),0 3px 0 -0px var(--fcl);display:grid;place-items:center;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.ticon{width:68%;height:68%;border-radius:23%;background:linear-gradient(150deg,color-mix(in srgb,var(--fc),#fff 22%),color-mix(in srgb,var(--fc),#000 18%));display:grid;place-items:center;color:#fff;font-weight:700;letter-spacing:-.03em;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px -2px color-mix(in srgb,var(--fc),transparent 40%)}
.ticon span{font-size:calc(var(--t) * .2)}
.ticon span.l4{font-size:calc(var(--t) * .16)}
.ticon span.l5{font-size:calc(var(--t) * .135)}
.tile.joint .tface::after{content:"*";position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:15px;line-height:24px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.tlabel{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center;font-size:11px;line-height:1.3;color:var(--ink2);margin-top:9px;width:var(--lw);margin-left:calc((var(--t) - var(--lw)) / 2);opacity:0;transition:opacity .45s}
.tile.on .tlabel{opacity:1}
.tile:not(.on){opacity:.42;filter:saturate(.35)}
.tile.on .tface{transform:translateY(-6px)}
.tile:hover .tface,.tile.hot .tface{transform:translateY(-10px) scale(1.06)}
.tile:focus-visible{outline:none}.tile:focus-visible .tface{outline:2px solid var(--fc);outline-offset:4px}

.hcopy{position:absolute;left:0;right:0;top:var(--copy,336px);text-align:center;padding:0 24px;pointer-events:none}
.hcopy>*{pointer-events:auto}
.h-hero{font-weight:700;font-size:clamp(40px,6vw,76px);line-height:1;letter-spacing:-.05em;margin:0}
.sub{font-size:16.5px;color:var(--ink2);max-width:580px;margin:16px auto 0}
.fline{margin-top:26px;min-height:44px}
.fline b{display:block;color:var(--fcl);font-weight:600;font-size:15px;transition:color .4s}
.fline span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.fpills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:880px;margin:16px auto 0}
.fpill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 10px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 75%,transparent);font-size:12.5px;color:var(--ink2);cursor:pointer;transition:all .25s;white-space:nowrap}
.fpill i{width:8px;height:8px;border-radius:50%;background:var(--fcl)}
.fpill:hover{border-color:var(--fcl);color:var(--ink)}
.fpill.on{background:color-mix(in srgb,var(--fc) 12%,var(--surface));border-color:var(--fcl);color:var(--ink);font-weight:500}
.hfoot{position:absolute;left:28px;right:28px;bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
.hfoot .ctl{display:flex;gap:6px}
.rbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.rbtn:hover{border-color:var(--ink2)}

/* flip card */
#pop{position:fixed;z-index:60;width:256px;background:#121316;color:#E9E9E6;border-radius:20px;padding:16px 16px 14px;box-shadow:0 22px 48px -12px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06);display:none;cursor:pointer}
#pop.show{display:block;animation:flip .32s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{opacity:0;transform:perspective(700px) rotateY(-80deg) scale(.92)}to{opacity:1;transform:none}}
#pop .ph1{display:flex;align-items:center;gap:10px}
#pop .ph1 b{font-size:14px;font-weight:600}
#pop .ph1 em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:#9A9DA4}
#pop .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--pc);margin:14px 0 6px}
#pop h4{font-size:17px;line-height:1.28;color:#fff;letter-spacing:-.02em}
#pop p{font-size:12.5px;color:#9A9DA4;margin:8px 0 0}
#pop .pf{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:#9A9DA4;border-top:1px solid rgba(255,255,255,.08);margin-top:14px;padding-top:10px}
#pop .pf b{color:#fff;font-weight:500}

/* mini tile icon (used outside the ring) */
.mt{position:relative;flex:none;width:var(--s,34px);height:var(--s,34px);border-radius:27%;background:linear-gradient(150deg,color-mix(in srgb,var(--fc),#fff 22%),color-mix(in srgb,var(--fc),#000 18%));display:grid;place-items:center;color:#fff;font-weight:700;letter-spacing:-.03em;font-size:calc(var(--s,34px) * .3);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.mt.l4{font-size:calc(var(--s,34px) * .24)}.mt.l5{font-size:calc(var(--s,34px) * .2)}

/* sections */
section.block{padding:96px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.h-sec{font-size:clamp(30px,4vw,48px);line-height:1.04;letter-spacing:-.045em;font-weight:700}
.sec-head p{margin:12px 0 0;color:var(--muted);max-width:560px;font-size:16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{width:22px;height:14px;border-radius:4px;display:inline-block}
.sw.core{background:var(--surface);border:1.5px solid var(--ink2)}
.sw.joint{background:repeating-linear-gradient(135deg,var(--surface) 0 3px,var(--accent-soft) 3px 5px);border:1.5px dashed var(--accent)}

/* field explorer */
.ex{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;align-items:start}
.flist{display:flex;flex-direction:column;gap:2px;position:sticky;top:84px}
.frow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;text-align:left;font-size:14.5px;color:var(--ink2);transition:background .2s,color .2s}
.frow i{width:10px;height:10px;border-radius:3px;background:var(--fcl);flex:none}
.frow .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
.frow:hover{background:color-mix(in srgb,var(--surface) 70%,transparent);color:var(--ink)}
.frow.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow)}
.frow.on .n{color:var(--fcl)}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;animation:fade .35s ease}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ffig{position:relative;height:180px;border-radius:14px;color:var(--fcl);background:linear-gradient(color-mix(in srgb,var(--fc) 7%,transparent) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,color-mix(in srgb,var(--fc) 7%,transparent) 1px,transparent 1px) 0 0/28px 28px,color-mix(in srgb,var(--fc) 6%,var(--surface2));overflow:hidden}
.ffig svg{width:100%;height:100%}
.ffig.big{height:240px;border:1px solid var(--line)}
.ffig .ft{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fcl)}
.fhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:20px 0 14px}
.fhead h3{font-size:24px;letter-spacing:-.035em}
.fhead span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:8px}
.dcard{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;min-width:0;transition:transform .15s,box-shadow .15s}
.dcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.dcard .nm{font-size:13.5px;font-weight:500;line-height:1.3;min-width:0}
.dcard .kt{margin-left:auto;flex:none;font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:2px 6px;border-radius:5px;white-space:nowrap}
.dcard.core{background:var(--surface);border:1px solid var(--line)}
.dcard.core .kt{background:var(--ink);color:var(--bg)}
.dcard.joint{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--accent) 8%,transparent) 8px 9px),var(--surface2);border:1.5px dashed color-mix(in srgb,var(--accent) 70%,transparent)}
.dcard.joint .kt{color:var(--accent);border:1px solid var(--accent)}
.star{color:var(--accent);font-weight:700}
.tasks{margin-top:20px}
.trow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line2);font-size:14px}
.trow .tt{min-width:0}
.trow .tt small{display:block;color:var(--muted);font-size:12px}
.trow .go{margin-left:auto;color:var(--faint)}
.trow:hover .go{color:var(--ink)}
.note{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 7px}

/* scoring diagram */
.diagram{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;--anno:#4353FF;--anno-soft:rgba(67,83,255,.08)}
.diagram .mob{display:none}
.dlist{display:none}
.atag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;background:var(--anno,#4353FF);color:#fff;padding:3px 7px;line-height:1.2}

/* bottom pair */
.pair{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;position:relative;overflow:hidden}
.pcard.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pcard.dark p{color:color-mix(in srgb,var(--bg) 62%,transparent)}
.pcard.dark .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.pcard h3{font-size:26px;letter-spacing:-.04em;font-weight:700}
.pcard p{margin:10px 0 0;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:22px;border-bottom:1px solid var(--line)}
.bars i{flex:1;border-radius:4px 4px 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,var(--surface2)),color-mix(in srgb,var(--c) 15%,var(--surface2)));opacity:.8}

footer.pf{border-top:1px solid var(--line);padding:40px 0 48px;font-size:13.5px;color:var(--muted)}
.fgrid{display:flex;justify-content:space-between;gap:28px;flex-wrap:wrap}
.flinks{display:flex;gap:22px;flex-wrap:wrap}
.flinks a:hover{color:var(--ink)}

/* all benchmarks page */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{height:38px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 16px;font-size:14px;min-width:240px}
.area{margin-bottom:30px}
.area-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.area-head i{width:10px;height:10px;border-radius:3px;background:var(--fcl)}
.area-head h3{font-size:17px}
.area-head .cnt{font-family:var(--mono);font-size:11px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* benchmark page */
.page-top{padding:112px 0 0}
.crumb{display:inline-flex;gap:6px;font-size:13.5px;color:var(--muted);margin-bottom:24px}
.crumb:hover{color:var(--ink)}
.bhead{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center}
.bhead h1{font-weight:700;font-size:clamp(38px,5.6vw,68px);line-height:1;letter-spacing:-.05em;margin-top:18px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
.tag.core{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.joint{border:1px dashed var(--accent);color:var(--accent);background:var(--accent-soft)}
.subnav{position:sticky;top:64px;z-index:20;display:flex;gap:6px;margin:40px 0 0;padding:10px 0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line2)}
.subnav::-webkit-scrollbar{display:none}
.bsec{padding:40px 0 8px;scroll-margin-top:130px}
.bsec h2{font-size:26px;margin-bottom:16px;letter-spacing:-.035em}
.ph{position:relative;border:1px dashed var(--line);border-radius:18px;background:var(--surface);padding:22px}
.ph-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);background:var(--surface2);padding:2px 7px;border-radius:5px}
.real{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:22px}
.skel{height:10px;border-radius:5px;background:var(--line2);margin:9px 0}
.paper{display:grid;grid-template-columns:110px 1fr;gap:22px;align-items:start}
.paper .cover{aspect-ratio:3/4;border-radius:8px;border:1px solid var(--line);background:repeating-linear-gradient(180deg,var(--surface2) 0 14px,var(--line2) 14px 15px);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--faint)}
.paper h3{font-size:20px}
.paper .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tcard h4{font-size:16.5px;margin:12px 0 8px;line-height:1.3}
.tcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tcard .meta span{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.tcard ol{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:13.5px}
.tax{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tax-dir h4{font-size:15.5px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{font-size:12.5px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink2)}
.cat.sk{color:transparent;min-width:84px;background:var(--line2);border-color:transparent}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.person{display:flex;gap:12px;align-items:center;margin-top:14px}
.av{width:40px;height:40px;border-radius:50%;background:var(--line2);flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.person .nm{font-weight:500;font-size:14px}
.person .rl{font-size:12.5px;color:var(--muted)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:56px}
.pn a{padding:18px 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.pn a:hover{border-color:var(--ink2)}
.pn .r{text-align:right}

/* contribute + leaderboard pages */
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
.card h3{font-size:19px}
ul.rules{margin:12px 0 0;padding-left:18px;color:var(--ink2);font-size:14px;display:grid;gap:6px}
.gform{width:100%;border:0;border-radius:10px;background:#fff;display:block}
.card a:not(.btn){text-decoration:underline;text-underline-offset:2px}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

/* ---------- responsive ---------- */
@media (max-width:1100px){.hero{--R:860px;--t:80px;--lw:92px}}
@media (max-width:900px){
  .nav,.right .desk{display:none}
  .menu-btn{display:inline-flex}
  .hdr.open{background:var(--bg)}
  .hdr.open .mpanel{display:block;position:absolute;left:0;right:0;top:64px;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 24px 18px}
  .mpanel a{display:flex;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line2);font-size:19px;font-weight:500;letter-spacing:-.02em}
  .mpanel a:last-child{border-bottom:0}
  .right{margin-left:auto}
  .ex{grid-template-columns:1fr}
  .flist{position:static}
  .fpanel{margin:6px 0 10px}
  .pair{grid-template-columns:1fr}
  .bhead{grid-template-columns:1fr;gap:24px}
  .tgrid,.feats{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .diagram .desk{display:none}.diagram .mob{display:block}.dlist{display:grid;gap:12px;margin-top:20px}
}
@media (max-width:640px){
  .container{padding:0 18px}.hdr-in{padding:0 18px}
  .hero{--R:620px;--t:60px;--lw:68px;--top:100px;height:auto;padding-bottom:76px}
  .hcopy{position:relative;top:auto;padding:196px 18px 0}
  .tlabel{font-size:9.5px;margin-top:6px}
  .tile.joint .tface::after{width:16px;height:16px;font-size:12px;line-height:19px;top:-5px;right:-5px}
  .sub{font-size:15.5px}
  .fpills{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;margin:16px -18px 0;padding:2px 18px 4px;scroll-snap-type:x proximity}
  .fpills::-webkit-scrollbar{display:none}
  .fpill{scroll-snap-align:center}
  .hfoot{left:18px;right:18px;bottom:16px}
  .hfoot .hint{display:none}
  .logo .lsub{display:none}
  .hfoot{justify-content:center}
  section.block{padding:64px 0}
  .team,.tax{grid-template-columns:1fr}
  .paper{grid-template-columns:1fr}.paper .cover{display:none}
  .pn{grid-template-columns:1fr}
  .ffig.big{height:170px}
  .dcards{grid-template-columns:1fr}
  .search{min-width:0;width:100%}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px;width:calc(100% + 36px)}
  .chips::-webkit-scrollbar{display:none}
  #pop{width:236px}
}
@media (prefers-reduced-motion:reduce){.ring{transition:none}#pop.show{animation:none}}
</style>

<body>
<div id="root"></div>
<div id="pop" role="dialog" aria-live="polite"></div>
<script>
/* =====================================================================
   SETTINGS: edit these
   ===================================================================== */
const CONFIG = {
  contactEmail: 'efe-team@example.org',  // shown in the footer and as the backup on the Contribute page
  googleFormUrl: '__FORMURL__',
  googleFormHeight: 1100,               // height of the embedded form in pixels
  workspaceUrl: ''                      // link for "Team sign in"; empty = hidden
};

/* =====================================================================
   PUBLIC DATA (see README for how to fill in papers, tasks, taxonomy, team)
   ===================================================================== */
const DATA = __DATA__;

/* ===================================================================== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const NA=DATA.areas.length;
// field colors: evenly spaced around the color wheel, so the ring reads like a palette
const hueOf=i=>(150+i*360/NA)%360;
const colOf=i=>{const h=hueOf(i);return`hsl(${h.toFixed(0)} ${h>35&&h<95?62:58}% ${h>35&&h<95?40:46}%)`};
const AREA=Object.fromEntries(DATA.areas.map((a,i)=>[a.id,{...a,i,col:colOf(i)}]));
const B=DATA.benchmarks, BY=Object.fromEntries(B.map(b=>[b.slug,b]));
const inArea=id=>B.filter(b=>b.area===id);
const fcv=id=>`--fc:${AREA[id].col}`;
const exTitle=b=>(b.examples&&b.examples[0]&&b.examples[0].title)||b.example;
const I={
 moon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
 arrow:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
 left:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>',
 right:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
 menu:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>'
};
const lc=code=>code.length>=5?'l5':code.length===4?'l4':'';
const mt=(b,s)=>`<span class="mt fc ${lc(b.code)}" style="${fcv(b.area)};--s:${s||34}px">${esc(b.code)}</span>`;
const star=b=>b.shared?'<span class="star" title="Joint benchmark, co-built with a partner team">*</span>':'';
const kindTag=b=>`<span class="kt">${b.shared?'JOINT *':'CORE'}</span>`;
const PH='<span class="ph-tag">Placeholder</span>';

/* ---------- area drawings (original line art, one per field) ---------- */
const SV=(inner)=>`<svg viewBox="0 0 240 140" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ART={
 fin:()=>{let s='';const h=[[40,70],[55,62],[48,80],[66,58],[60,84],[78,50],[70,76],[88,44],[82,60],[96,38]];h.forEach(([lo,hi],i)=>{const x=24+i*20,up=i%3!==1,t=140-hi,bt=140-(lo+hi)/2-10;s+=`<line x1="${x}" y1="${t-8}" x2="${x}" y2="${140-lo+8}" opacity=".5"/><rect x="${x-5}" y="${Math.min(t,bt)}" width="10" height="${Math.abs(bt-t)+12}" ${up?'fill="currentColor" fill-opacity=".85"':''}/>`});return SV(s+'<path d="M16 96 C60 90 90 80 120 70 S190 50 228 34" stroke-dasharray="4 4" opacity=".7"/>')},
 biz:()=>SV('<path d="M30 20V118H220" opacity=".5"/><path d="M40 108 C90 96 140 60 210 26"/><path d="M40 30 C100 44 150 84 210 110"/><circle cx="126" cy="70" r="5" fill="currentColor"/><path d="M126 70V118M126 70H30" stroke-dasharray="3 4" opacity=".6"/>'),
 soft:()=>{let s='<rect x="18" y="14" width="204" height="112" rx="6" opacity=".5"/><path d="M18 30H222" opacity=".5"/><circle cx="30" cy="22" r="2.5" fill="currentColor"/><circle cx="40" cy="22" r="2.5" fill="currentColor" opacity=".6"/><circle cx="50" cy="22" r="2.5" fill="currentColor" opacity=".3"/>';[[0,70],[1,110],[1,84],[2,60],[2,96],[1,40],[0,52],[1,120]].forEach(([ind,w],i)=>{s+=`<rect x="${34+ind*16}" y="${42+i*10}" width="${w}" height="4" rx="2" fill="currentColor" stroke="none" opacity="${i%3===1?.9:.35}"/>`});return SV(s)},
 sys:()=>{const n=[[40,40],[40,100],[100,26],[100,70],[100,114],[160,48],[160,94],[210,70]];const e=[[0,2],[0,3],[1,3],[1,4],[2,5],[3,5],[3,6],[4,6],[5,7],[6,7]];let s='';e.forEach(([a,b],i)=>{s+=`<line x1="${n[a][0]}" y1="${n[a][1]}" x2="${n[b][0]}" y2="${n[b][1]}" ${[1,6,9].includes(i)?'stroke-width="3"':'opacity=".45"'}/>`});n.forEach(([x,y],i)=>{s+=`<circle cx="${x}" cy="${y}" r="${i===3?8:6}" fill="var(--surface)" ${i===3?'stroke-width="2.4"':''}/>`});return SV(s)},
 tel:()=>SV('<path d="M62 120L80 30L98 120M68 92H92M72 70H88M76 50H84" /><circle cx="80" cy="28" r="4" fill="currentColor"/>'+[18,32,46,60].map(r=>`<path d="M${80+r*0.7} ${28-r*0.7} A${r} ${r} 0 0 1 ${80+r*0.7} ${28+r*0.7}" opacity="${1-r/80}"/>`).join('')+'<rect x="160" y="78" width="22" height="36" rx="4"/><rect x="196" y="58" width="22" height="36" rx="4" opacity=".6"/>'),
 earth:()=>SV('<path d="M20 110 C50 90 70 120 100 104 S150 80 180 96 S220 110 226 100" opacity=".45"/><path d="M30 122 C60 104 80 130 110 116 S160 96 190 110" opacity=".3"/><path d="M14 96 C46 74 70 100 98 88 S146 62 176 78 S214 86 228 76" opacity=".6"/><ellipse cx="128" cy="50" rx="96" ry="22" stroke-dasharray="3 5" opacity=".6"/><rect x="152" y="18" width="14" height="12" fill="currentColor"/><path d="M146 24H134M172 24H184M146 20V28M178 20V28" /><path d="M159 30L150 60" stroke-dasharray="2 4" opacity=".7"/>'),
 hw:()=>{let s='<rect x="76" y="26" width="88" height="88" rx="6"/>';for(let i=0;i<6;i++){const p=38+i*13;s+=`<path d="M${p} 26V12M${p} 114V128M76 ${p}H62M164 ${p}H178" opacity=".55"/>`}[[86,36,30,26],[122,36,32,18],[122,60,32,44],[86,68,30,36]].forEach(([x,y,w,h],i)=>{s+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${i===2?'fill="currentColor" fill-opacity=".25"':'opacity=".7"'}/>`});return SV(s+'<path d="M24 40H50V70H62M178 100H200V60H226" opacity=".45"/>')},
 ai:()=>SV('<rect x="26" y="16" width="150" height="98" rx="6" opacity=".55"/><path d="M26 32H176" opacity=".55"/><rect x="40" y="46" width="60" height="10" rx="2" opacity=".5"/><rect x="40" y="66" width="96" height="10" rx="2" opacity=".5"/><rect x="40" y="88" width="40" height="14" rx="3" fill="currentColor" fill-opacity=".25"/><path d="M60 95 C110 120 150 120 190 84" stroke-dasharray="3 5"/><path d="M188 70L206 112L212 96L228 92Z" fill="currentColor"/><circle cx="60" cy="95" r="10" opacity=".4"/><circle cx="60" cy="95" r="16" opacity=".2"/>'),
 rob:()=>SV('<rect x="34" y="112" width="60" height="12" rx="3"/><path d="M64 112V96L104 56L160 62L184 86" stroke-width="5" opacity=".85"/><circle cx="64" cy="96" r="7" fill="var(--surface)"/><circle cx="104" cy="56" r="7" fill="var(--surface)"/><circle cx="160" cy="62" r="6" fill="var(--surface)"/><path d="M184 86L176 100M184 86L198 96"/><rect x="170" y="102" width="34" height="22" stroke-dasharray="4 4" opacity=".7"/>'),
 eng:()=>SV('<path d="M70 52L130 30L190 52L130 74Z"/><path d="M70 52V102L130 124V74M190 52V102L130 124" /><path d="M58 56V108M52 108H64M52 56H64" opacity=".55"/><path d="M76 116L124 132" opacity=".55"/><path d="M96 82h20M106 72v20" opacity=".5"/><circle cx="160" cy="88" r="8" opacity=".6"/>'),
 phys:()=>{const f=x=>112-70*Math.exp(-((x-80)**2)/180)-44*Math.exp(-((x-150)**2)/320)-26*Math.exp(-((x-200)**2)/90);let p='M14 112';for(let x=14;x<=228;x+=4)p+=` L${x} ${f(x).toFixed(1)}`;return SV(`<path d="M14 116H228" opacity=".4"/><path d="${p}"/>`+[40,62,80,98,122,150,176,200,214].map(x=>`<circle cx="${x}" cy="${(f(x)+((x*7)%9-4)).toFixed(1)}" r="2.6" fill="currentColor" opacity=".7"/>`).join(''))},
 life:()=>{const hex=(cx,cy,r)=>Array.from({length:6},(_,i)=>{const a=Math.PI/3*i+Math.PI/6;return[(cx+r*Math.cos(a)).toFixed(1),(cy+r*Math.sin(a)).toFixed(1)]});const h1=hex(92,72,26),h2=hex(137,72,26);let s=`<path d="M${h1.map(p=>p.join(' ')).join('L')}Z"/><path d="M${h2.map(p=>p.join(' ')).join('L')}Z"/>`;s+=`<path d="M${h1[3][0]} ${h1[3][1]}L50 72M${h2[0][0]} ${h2[0][1]}L178 50M${h2[1][0]} ${h2[1][1]}L178 100" opacity=".7"/>`;[[50,72],[178,50],[178,100]].forEach(([x,y],i)=>{s+=`<circle cx="${x}" cy="${y}" r="7" ${i===1?'fill="currentColor"':'fill="var(--surface)"'}/>`});return SV(s+'<path d="M86 60l12 24M131 60l12 24" opacity=".45"/>')},
 med:()=>SV('<circle cx="104" cy="70" r="54" opacity=".35"/><circle cx="104" cy="70" r="42" opacity=".5"/><path d="M80 52 C90 40 120 40 130 56 S126 92 104 96 S70 84 80 52Z" opacity=".6"/><circle cx="118" cy="60" r="9" fill="currentColor" fill-opacity=".35"/><rect x="104" y="46" width="30" height="28" stroke-width="1.8"/><path d="M134 46H186" stroke-dasharray="3 3"/><rect x="186" y="38" width="38" height="16" fill="currentColor" stroke="none"/>'),
 edu:()=>SV('<rect x="40" y="92" width="120" height="16" rx="3"/><rect x="52" y="74" width="104" height="16" rx="3" opacity=".75"/><rect x="46" y="56" width="96" height="16" rx="3" opacity=".55"/><path d="M178 40L208 28L238 40L208 52Z" fill="currentColor" fill-opacity=".25"/><path d="M192 46V60C200 66 216 66 224 60V46M234 42V64"/><path d="M14 120H226" opacity=".35"/>')
};
const art=id=>(ART[id]||ART.edu)();

/* ---------- header / footer ---------- */
function header(on){
  const L=[['#/benchmarks','Benchmarks','b'],['#/','Fields','f'],['#/leaderboard','Leaderboard','l'],['#/contribute','Contribute','c']];
  return`<header class="hdr" id="hdr"><div class="hdr-in">
   <a class="logo" href="#/"><span class="logo-mark">E</span>EFE<span class="lsub"><span class="dot">·</span> <span class="muted" style="font-weight:400">Experts’ First Exam</span></span></a>
   <nav class="nav" aria-label="Main">${L.map(([h,t,k])=>`<a href="${h}" ${k==='f'?'data-act="jump" data-v="fields"':''} class="${on===k?'on':''}">${t}</a>`).join('')}</nav>
   <div class="right"><button class="btn icon" data-act="theme" aria-label="Switch light or dark">${I.moon}</button>
    ${CONFIG.workspaceUrl?`<a class="btn sm desk" href="${esc(CONFIG.workspaceUrl)}">Team sign in</a>`:''}
    <a class="btn sm dark desk" href="#/contribute">Contribute a task</a>
    <button class="btn sm menu-btn" data-act="menu" aria-label="Open menu">${I.menu} Menu</button></div>
   <div class="mpanel">${L.map(([h,t,k])=>`<a href="${h}" ${k==='f'?'data-act="jump" data-v="fields"':''}>${t}<span>${I.arrow}</span></a>`).join('')}${CONFIG.workspaceUrl?`<a href="${esc(CONFIG.workspaceUrl)}">Team sign in<span>${I.arrow}</span></a>`:''}</div>
  </div></header>`;
}
const foot=()=>`<footer class="pf"><div class="container fgrid">
  <div><div class="logo" style="color:var(--ink)"><span class="logo-mark">E</span>Experts’ First Exam</div><p style="margin:10px 0 0;max-width:360px">Benchmarks built from real expert workflows.</p></div>
  <div class="flinks"><a href="#/benchmarks">Benchmarks</a><a href="#/leaderboard">Leaderboard</a><a href="#/contribute">Contribute</a><a href="mailto:${esc(CONFIG.contactEmail)}">${esc(CONFIG.contactEmail)}</a></div>
 </div></footer>`;

/* ---------- hero: ring of benchmark tiles, grouped by field ---------- */
const GAP=0.7;                       // empty slots between fields
const SLOTS=B.length+NA*GAP;
const ANG={},CENTER={};
(()=>{let s=0;DATA.areas.forEach(a=>{const st=s;inArea(a.id).forEach(b=>{ANG[b.slug]=(s+.5)*360/SLOTS;s+=1});CENTER[a.id]=((st+s)/2)*360/SLOTS;s+=GAP})})();
const ORDERED=DATA.areas.flatMap(a=>inArea(a.id));
let heroField=DATA.areas[0].id, rot=-CENTER[heroField], auto=null, touched=false;

function hero(){
  return`<section class="hero" id="hero">
   <div class="ring" id="ring" style="--rot:${rot}deg">${ORDERED.map(b=>`<a class="tile fc ${b.shared?'joint':''} ${b.area===heroField?'on':''}" style="${fcv(b.area)};--a:${ANG[b.slug].toFixed(2)}deg" href="#/b/${b.slug}" data-tile="${b.slug}" aria-label="${esc(b.name)}"><span class="tface"><span class="ticon"><span class="${lc(b.code)}">${esc(b.code)}</span></span></span><span class="tlabel">${esc(b.name)}</span></a>`).join('')}</div>
   <div class="hcopy">
    <h1 class="h-hero">Experts’ First Exam</h1>
    <p class="sub">${B.length} benchmarks across ${NA} fields, built from real expert work. Agents must finish the job, and every result is checked against expert rubrics.</p>
    <div class="fline fc" id="fline" style="${fcv(heroField)}">${fline(heroField)}</div>
    <div class="fpills" id="fpills" role="tablist" aria-label="Fields">${DATA.areas.map(x=>`<button class="fpill fc ${x.id===heroField?'on':''}" style="${fcv(x.id)}" data-act="field" data-v="${x.id}" role="tab" aria-selected="${x.id===heroField}"><i></i>${esc(x.name)}</button>`).join('')}</div>
   </div>
   <div class="hfoot"><span class="hint">DRAG TO SPIN · HOVER A FIELD · HOVER A TILE TO SEE A TASK</span><span class="ctl"><button class="rbtn" data-act="step" data-v="-1" aria-label="Previous field">${I.left}</button><button class="rbtn" data-act="step" data-v="1" aria-label="Next field">${I.right}</button></span></div>
  </section>`;
}
function fline(id){const a=AREA[id],list=inArea(id),j=list.filter(b=>b.shared).length;
  return`<b>${esc(a.name)}</b><span>${pad(a.i+1)} · ${list.length} BENCHMARK${list.length>1?'S':''}${j?` · ${j} JOINT`:''}</span>`}
function setField(id,user){
  if(user){touched=true;stopAuto()}
  if(id===heroField&&!user)return;
  heroField=id;
  let target=-CENTER[id];let d=((target-rot)%360+540)%360-180;rot+=d;
  const ring=document.getElementById('ring');if(!ring)return;
  ring.style.setProperty('--rot',rot+'deg');
  ring.querySelectorAll('.tile').forEach(t=>t.classList.toggle('on',BY[t.dataset.tile].area===id));
  const fl=document.getElementById('fline');fl.style.cssText=fcv(id);fl.innerHTML=fline(id);
  document.querySelectorAll('.fpill').forEach(p=>{const on=p.dataset.v===id;p.classList.toggle('on',on);p.setAttribute('aria-selected',on);if(on&&user!=='hover'&&p.parentElement.scrollWidth>p.parentElement.clientWidth)p.parentElement.scrollTo({left:p.offsetLeft-p.parentElement.clientWidth/2+p.offsetWidth/2,behavior:'smooth'})});
  hidePop();
}
function step(n,user){const ids=DATA.areas.map(a=>a.id);setField(ids[(ids.indexOf(heroField)+n+ids.length)%ids.length],user)}
function startAuto(){stopAuto();if(touched||matchMedia('(prefers-reduced-motion: reduce)').matches)return;auto=setInterval(()=>{if(document.getElementById('ring')&&!document.hidden)step(1,false)},4200)}
function stopAuto(){if(auto){clearInterval(auto);auto=null}}

/* flip card for a tile */
let popSlug=null,popTimer=null;
function showPop(tile){
  const b=BY[tile.dataset.tile];const a=AREA[b.area];const p=document.getElementById('pop');
  popSlug=b.slug;clearTimeout(popTimer);
  document.querySelectorAll('.tile.hot').forEach(t=>t.classList.remove('hot'));tile.classList.add('hot');
  p.style.setProperty('--pc',`color-mix(in srgb,${a.col},#fff 35%)`);
  p.innerHTML=`<div class="ph1">${mt(b,30)}<b>${esc(b.name)}</b><em>${b.shared?'JOINT *':'CORE'}</em></div>
   <div class="k">Exam task · ${esc(a.name)}</div><h4>${esc(exTitle(b))}</h4>
   <p>Illustrative example. Real tasks will appear here as the benchmark is released.</p>
   <div class="pf"><span>EFE-${esc(b.code)}</span><b>Open →</b></div>`;
  p.classList.remove('show');void p.offsetWidth;p.classList.add('show');
  const r=tile.querySelector('.tface').getBoundingClientRect(),pw=p.offsetWidth,ph=p.offsetHeight;
  let x=r.left+r.width/2-pw/2,y=r.top-ph-12;if(y<74)y=r.bottom+14;
  x=Math.max(10,Math.min(window.innerWidth-pw-10,x));
  p.style.left=x+'px';p.style.top=y+'px';
}

/* drag to spin */
function bindHero(){
  const hero=document.getElementById('hero'),ring=document.getElementById('ring');if(!hero)return;
  let down=null,moved=false;
  hero.addEventListener('pointerdown',e=>{if(e.target.closest('button,.fpills'))return;down={x:e.clientX,r:rot};moved=false});
  window.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x;if(!moved&&Math.abs(dx)<6)return;
    if(!moved){moved=true;touched=true;stopAuto();hidePop();ring.classList.add('drag')}
    rot=down.r+dx*(innerWidth<640?0.09:0.06);ring.style.setProperty('--rot',rot+'deg')});
  window.addEventListener('pointerup',()=>{if(!down)return;const was=moved;down=null;ring.classList.remove('drag');
    if(was){const front=((-rot)%360+360)%360;let best=null,bd=1e9;DATA.areas.forEach(a=>{const d=Math.abs(((CENTER[a.id]-front)%360+540)%360-180);if(d<bd){bd=d;best=a.id}});heroField=null;setField(best,true)}});
  hero.addEventListener('click',e=>{if(moved){e.preventDefault();moved=false;return}
    const t=e.target.closest('.tile');if(!t)return;
    if(matchMedia('(hover: none)').matches&&popSlug!==t.dataset.tile){e.preventDefault();showPop(t)}});
  ring.addEventListener('mouseover',e=>{const t=e.target.closest('.tile');if(t&&matchMedia('(hover: hover)').matches&&t.dataset.tile!==popSlug)showPop(t)});
  ring.addEventListener('mouseleave',()=>{popTimer=setTimeout(()=>{if(!document.getElementById('pop').matches(':hover'))hidePop()},220)});
  document.getElementById('fpills').addEventListener('mouseover',e=>{const p=e.target.closest('.fpill');if(p&&matchMedia('(hover: hover)').matches)setField(p.dataset.v,'hover')});
  hero.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){step(1,true)}else if(e.key==='ArrowLeft'){step(-1,true)}});
  startAuto();
}

   ${[0,1,2,3].map(i=>`<rect x="${24+i*98}" y="206" width="86" height="50" rx="6" fill="var(--surface)" stroke="var(--line)"/><rect x="${36+i*98}" y="220" width="${40+i*8}" height="6" rx="3" fill="var(--line)"/><rect x="${36+i*98}" y="234" width="30" height="6" rx="3" fill="var(--line)"/>`).join('')}
   ${[0,1,2,3,4].map(i=>`<rect x="24" y="${294+i*11}" width="${[300,280,330,260,310][i]}" height="6" rx="3" fill="var(--line)"/>`).join('')}
   <rect x="300" y="364" width="106" height="28" rx="14" fill="var(--ink)"/><text x="353" y="383" text-anchor="middle" font-family="var(--sans)" font-size="12" fill="var(--bg)">Submit</text></g>`;
  const boxes=[[16,74,410,98],[16,198,410,66],[16,284,342,62],[292,358,122,38]];
  const ys=[100,190,280,370];
  const desk=`<svg class="desk" viewBox="0 0 1000 410" width="100%" role="img" aria-label="How an EFE task is scored">${win(0)}
    ${boxes.map(([x,y,w,h],i)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="var(--anno-soft)" stroke="var(--anno)" stroke-width="1.5"/><rect x="${x}" y="${y-16}" width="26" height="16" fill="var(--anno)"/><text x="${x+13}" y="${y-4}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="#fff">${L[i][0]}</text>
      <path d="M${x+w} ${y+h/2} C${x+w+80} ${y+h/2} 560 ${ys[i]} 600 ${ys[i]}" stroke="var(--anno)" stroke-width="1.2" fill="none"/><circle cx="600" cy="${ys[i]}" r="3.5" fill="var(--anno)"/>
      <text x="620" y="${ys[i]-4}" font-family="var(--sans)" font-weight="600" font-size="21" fill="var(--ink)">${L[i][1]}</text><text x="620" y="${ys[i]+18}" font-family="var(--sans)" font-size="14" fill="var(--muted)">${L[i][2]}</text>`).join('')}</svg>`;
  const mob=`<svg class="mob" viewBox="0 0 440 410" width="100%" aria-hidden="true">${win(5)}${boxes.map(([x,y,w,h],i)=>`<rect x="${x+5}" y="${y}" width="${w}" height="${h}" rx="4" fill="var(--anno-soft)" stroke="var(--anno)" stroke-width="1.5"/><rect x="${x+5}" y="${y-18}" width="30" height="18" fill="var(--anno)"/><text x="${x+20}" y="${y-5}" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="#fff">${L[i][0]}</text>`).join('')}</svg>
   <div class="dlist">${L.map(([n,t,d])=>`<div style="display:flex;gap:12px;align-items:flex-start"><span class="atag">${n}</span><div><b style="font-weight:600;font-size:16px">${t}</b><div class="muted" style="font-size:14px">${d}</div></div></div>`).join('')}</div>`;
  return`<div class="diagram">${desk}${mob}</div>`;

  bindHero();onScroll();
}
function onScroll(){const hd=document.getElementById('hdr');if(hd)hd.classList.toggle('solid',scrollY>8||!document.getElementById('hero'))}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/')||!location.hash){render();window.scrollTo(0,0)}});
let wasMob=matchMedia('(max-width:900px)').matches;
window.addEventListener('resize',()=>{hidePop();const m=matchMedia('(max-width:900px)').matches;if(m!==wasMob){wasMob=m;const w=document.getElementById('exwrap');if(w)w.innerHTML=explorer()}});
document.addEventListener('click',e=>{
  const hdr=document.getElementById('hdr');
  if(hdr&&hdr.classList.contains('open')&&!e.target.closest('[data-act=menu]'))hdr.classList.remove('open');
  if(!e.target.closest('#pop')&&!e.target.closest('.tile'))hidePop();
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,v=a.dataset.v;
  if(act==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('efe-theme',r.dataset.theme)}catch(err){}}
  else if(act==='menu'){hdr.classList.toggle('open')}
  else if(act==='jump'){const el=document.getElementById(v);if(el){e.preventDefault();el.scrollIntoView({behavior:'smooth',block:'start'})}else if(v==='fields'){e.preventDefault();location.hash='#/';setTimeout(()=>{const f=document.getElementById('fields');if(f)f.scrollIntoView()},60)}}
  else if(act==='field'){setField(v,true)}
  else if(act==='step'){step(Number(v),true)}
  else if(act==='ex'){setEx(v)}
  else if(act==='filter'){gFilter=v;document.querySelectorAll('[data-act=filter]').forEach(c=>c.classList.toggle('on',c.dataset.v===v));document.getElementById('gridwrap').innerHTML=grid()}
  else if(act==='kind'){gKind=v;document.querySelectorAll('[data-act=kind]').forEach(c=>c.classList.toggle('on',c.dataset.v===v));document.getElementById('gridwrap').innerHTML=grid()}
});
document.getElementById('pop').addEventListener('click',()=>{if(popSlug)location.hash='#/b/'+popSlug});
document.getElementById('pop').addEventListener('mouseleave',()=>{popTimer=setTimeout(hidePop,200)});
document.addEventListener('mouseover',e=>{const r=e.target.closest('.frow');if(r&&matchMedia('(hover: hover) and (min-width: 901px)').matches&&r.dataset.v!==exField){exField=r.dataset.v;document.querySelectorAll('.frow').forEach(x=>{x.classList.toggle('on',x.dataset.v===exField);x.setAttribute('aria-expanded',x.dataset.v===exField)});const w=document.getElementById('fpanelwrap');if(w)w.innerHTML=fpanel(exField)}});
document.addEventListener('input',e=>{if(e.target.dataset.input==='q'){gQuery=e.target.value;document.getElementById('gridwrap').innerHTML=grid()}});
try{const t=localStorage.getItem('efe-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
render();
</script>
</body>
</html>
