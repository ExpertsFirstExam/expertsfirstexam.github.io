:root{
  --bg:#F4F4F1;--surface:#FFFFFF;--surface2:#F9F9F7;--ink:#111214;--ink2:#3A3D44;--muted:#73767D;--faint:#A6A9AF;
  --line:#E1E0DB;--line2:#EBEAE6;--grid:rgba(17,18,20,.055);
  --anno:#4353FF;--anno-soft:rgba(67,83,255,.09);--accent:#E0531F;--accent-soft:#FCE9E1;
  --lift:0%;--shadow:0 1px 2px rgba(17,18,20,.04),0 12px 32px rgba(17,18,20,.07);
  --head:'Space Grotesk',system-ui,sans-serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0D10;--surface:#15171B;--surface2:#1A1C21;--ink:#EDECE8;--ink2:#C6C5C0;--muted:#979AA2;--faint:#6A6D74;
  --line:#2A2C32;--line2:#202328;--grid:rgba(255,255,255,.05);--anno:#8590FF;--anno-soft:rgba(133,144,255,.12);
  --accent:#FF7547;--accent-soft:#3A1E14;--lift:38%;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#0C0D10;--surface:#15171B;--surface2:#1A1C21;--ink:#EDECE8;--ink2:#C6C5C0;--muted:#979AA2;--faint:#6A6D74;
  --line:#2A2C32;--line2:#202328;--grid:rgba(255,255,255,.05);--anno:#8590FF;--anno-soft:rgba(133,144,255,.12);
  --accent:#FF7547;--accent-soft:#3A1E14;--lift:38%;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--head);font-weight:500;letter-spacing:-.025em}
svg{display:block}
.container{max-width:1220px;margin:0 auto;padding:0 28px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gridbg{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px}
.c{--cc:color-mix(in srgb,var(--c),#fff var(--lift))}

/* announcement bar */
.bar{background:var(--ink);color:var(--bg);font-size:12.5px;text-align:center;padding:8px 44px;position:relative}
.bar a{text-decoration:underline;text-underline-offset:2px;margin-left:10px}
.bar button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:inherit;cursor:pointer;font-size:16px;opacity:.7;padding:4px 8px}

/* header */
.hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line2)}
.hdr-in{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:500;font-size:15px;line-height:1.1;white-space:nowrap}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:15px}
.logo small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
.navpill{display:flex;align-items:center;gap:2px;margin-left:24px;background:var(--ink);border-radius:999px;padding:4px}
.navpill a{color:color-mix(in srgb,var(--bg) 70%,transparent);font-size:13.5px;padding:6px 14px;border-radius:999px}
.navpill a:hover{color:var(--bg)}
.navpill a.on{background:var(--bg);color:var(--ink)}
.hdr .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap;transition:border-color .15s,transform .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.dark:hover{transform:translateY(-1px)}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn.icon{width:38px;padding:0;border-color:transparent;background:transparent}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.menu-btn{display:none}
.mpanel{display:none}

/* hero */
.hero{position:relative;border-bottom:1px solid var(--line2)}
.hero-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;min-height:640px;align-items:end;padding:56px 0 64px}
.kicker{font-size:15px;color:var(--ink2);margin:0 0 22px;max-width:520px}
.kicker b{display:block;color:var(--accent);font-weight:500}
.h-hero{font-family:var(--head);font-weight:400;font-size:clamp(46px,7.4vw,104px);line-height:.95;letter-spacing:-.045em}
.sub{font-size:17px;color:var(--ink2);max-width:520px;margin:26px 0 0}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.scroll-hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);margin-top:44px}
.art{position:relative;height:560px}
.win{position:absolute;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:4px}
.win .tag,.atag{position:absolute;left:-1px;top:-20px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;background:var(--anno);color:#fff;padding:3px 7px;white-space:nowrap;line-height:1.2}
.win.sel{outline:1px solid var(--anno);outline-offset:6px}
.term{background:#111214;color:#C9CCD3;font-family:var(--mono);font-size:11.5px;padding:14px 16px;line-height:1.75;border-color:#111214}
.term .p{color:#7C89FF}.term .ok{color:#4CC07F}.term .dim{color:#6A6D74}
.sheet{padding:10px}
.sheet table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:10.5px}
.sheet td{border:1px solid var(--line2);padding:5px 6px;color:var(--muted);height:24px}
.sheet tr.hl td{background:var(--anno-soft);border-color:color-mix(in srgb,var(--anno) 35%,transparent)}
.sheet .bar-s{display:block;height:6px;border-radius:3px;background:var(--line)}
.box{position:absolute;border:1.5px solid var(--anno);background:var(--anno-soft)}
.box .atag{top:-18px;font-size:9.5px;padding:2px 6px}

/* sections */
section.block{padding:88px 0}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.h-sec{font-size:clamp(32px,4.6vw,56px);line-height:1.0;letter-spacing:-.04em;font-weight:400}
.sec-head p{margin:14px 0 0;color:var(--muted);max-width:560px;font-size:16px}
.note{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);padding:5px 10px;background:var(--surface)}
.note::before{content:"";width:6px;height:6px;background:var(--anno)}

/* about + stats */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
.about p{color:var(--ink2);font-size:16px;margin:16px 0 0;max-width:520px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.statc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px}
.statc .n{font-family:var(--head);font-size:44px;line-height:1;letter-spacing:-.04em}
.statc .l{color:var(--muted);font-size:14px;margin-top:8px}
.statc.ac .n{color:var(--anno)}

/* badges + art */
.badge{display:inline-grid;place-items:center;min-width:44px;height:24px;padding:0 7px;border-radius:6px;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;color:var(--cc);background:color-mix(in srgb,var(--c) 11%,transparent);border:1px solid color-mix(in srgb,var(--c) 26%,transparent)}
.badge.lg{min-width:62px;height:36px;font-size:13.5px;border-radius:9px}
.thumb{position:relative;color:var(--cc);background-color:var(--surface2);border-bottom:1px solid var(--line2);overflow:hidden}
.thumb svg{width:100%;height:100%}

/* gallery marquee */
.marquee{display:grid;gap:16px;overflow:hidden;padding:24px 0 6px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.mrow{display:flex;width:max-content;animation:slide var(--dur,110s) linear infinite}
.mrow.rev{animation-direction:reverse}
.marquee:hover .mrow,.marquee:focus-within .mrow{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.gcard{position:relative;display:block;width:272px;margin-right:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:transform .2s,box-shadow .2s;flex:none}
.gcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.gcard .ghead{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line2)}
.gcard .thumb{height:132px}
.gcard .gbody{padding:12px 14px 14px}
.gcard .gt{font-size:14px;font-weight:500;line-height:1.35;min-height:38px}
.gcard .gpills{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.gpill{font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line2);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.mrow{animation:none;flex-wrap:wrap;width:auto;padding:0 28px;gap:16px 0}.mrow .dup{display:none}.marquee{-webkit-mask-image:none;mask-image:none}}

/* benchmark grid */
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}
.kind{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:16px;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s;width:100%}
.kind:hover{transform:translateY(-2px)}
.kind .k-n{font-family:var(--head);font-size:40px;line-height:1;letter-spacing:-.04em;min-width:64px}
.kind h4{font-size:17px}
.kind p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.kind.core{background:var(--surface);border:1.5px solid var(--ink)}
.kind.joint{background:repeating-linear-gradient(135deg,var(--surface) 0 10px,var(--accent-soft) 10px 11px);border:1.5px dashed var(--accent)}

}

  .search{margin-left:0;width:100%;order:-1}
  .team,.tax{grid-template-columns:1fr}

  .cta-band{padding:36px 26px}
  .paper{grid-template-columns:1fr}.paper .cover{display:none}

  .bar .long{display:none}
  .gcard{width:236px}.gcard .thumb{height:112px}
  .bars{height:170px;gap:4px}
  .statc .n{font-size:36px}

  .features{grid-template-columns:1fr}
  .art{grid-template-columns:1fr 1fr;gap:26px 10px}
  .term{font-size:10px;padding:10px 11px}
  .logo small{display:none}
  .h-hero{font-size:clamp(44px,13vw,64px)}
}

  const L=[['#/','Home','h'],['#/benchmarks','Benchmarks','b'],['#/leaderboard','Leaderboard','l'],['#/contribute','Contribute','c']];
  let bar='';try{bar=CONFIG.announcement&&localStorage.getItem('efe-bar-off')!=='1'?CONFIG.announcement:''}catch(e){bar=CONFIG.announcement}
  return (bar?`<div class="bar"><span>${esc(bar)}</span><span class="long"> · ${B.length} benchmarks under construction</span><a href="#/contribute">Contribute<span class="long"> a task</span> ↗</a><button data-act="barclose" aria-label="Close">×</button></div>`:'')+
  `<header class="hdr" id="hdr"><div class="container hdr-in">
   <a class="logo" href="#/"><span class="logo-mark">E</span><span>Experts’ First Exam<small>A family of expert benchmarks</small></span></a>
   <nav class="navpill" aria-label="Main">${L.map(([h,t,k])=>`<a href="${h}" class="${on===k?'on':''}">${t}</a>`).join('')}</nav>
   <div class="right"><button class="btn icon" data-act="theme" aria-label="Switch light or dark">${I.moon}</button>
    ${CONFIG.workspaceUrl?`<a class="btn sm desk" href="${esc(CONFIG.workspaceUrl)}">Team sign in</a>`:''}
    <a class="btn sm dark desk" href="#/contribute">Get involved</a>
    <button class="btn sm menu-btn" data-act="menu" aria-label="Open menu">${I.menu} Menu</button></div>
   <div class="mpanel">${L.map(([h,t])=>`<a href="${h}">${t}<span>${I.arrow}</span></a>`).join('')}${CONFIG.workspaceUrl?`<a href="${esc(CONFIG.workspaceUrl)}">Team sign in<span>${I.arrow}</span></a>`:''}</div>
  </div></header>`;
}
const foot=()=>`<footer class="pf"><div class="container"><div class="fgrid">
  <div><div class="logo" style="color:var(--ink)"><span class="logo-mark">E</span>Experts’ First Exam</div><p style="margin:14px 0 0;max-width:380px">A family of benchmarks built from real expert workflows, measuring where frontier AI agents still fall short.</p></div>

/* ---------- gallery marquee ---------- */
function gallery(){
  const byArea=DATA.areas.map(a=>B.filter(b=>b.area===a.id));const mixed=[];
  for(let k=0;mixed.length<B.length;k++)byArea.forEach(g=>{if(g[k])mixed.push(g[k])});
  const rows=[mixed.filter((_,i)=>i%2===0),mixed.filter((_,i)=>i%2===1)];
  const card=(b,dup)=>{const t=(b.examples&&b.examples[0]&&b.examples[0].title)||b.example;
    return`<a class="gcard ${dup?'dup':''}" href="#/b/${b.slug}" ${dup?'tabindex="-1" aria-hidden="true"':''}><div class="ghead"><span>${esc(AREA[b.area].name)}</span>${badge(b)}</div>${thumb(b)}<div class="gbody"><div class="gt">${esc(t)}</div><div class="gpills"><span class="gpill">${esc(b.name)}${b.shared?' *':''}</span><span class="gpill">30+ rubric items</span></div></div></a>`};
  return`<div class="marquee">${rows.map((r,i)=>`<div class="mrow ${i?'rev':''}" style="--dur:${120+i*20}s">${r.map(b=>card(b)).join('')}${r.map(b=>card(b,1)).join('')}</div>`).join('')}</div>`;
}

/* ---------- benchmark grid ---------- */
function kindCards(){
  const k=(id,cls,n,title,text)=>`<button class="kind ${cls} ${kind!=='all'&&kind!==id?'dim':''}" data-act="kind" data-v="${kind===id?'all':id}" aria-pressed="${kind===id}"><span class="k-n">${n}</span><span><h4>${title}</h4><p>${text}</p></span></button>`;
  return`<div class="kinds">${k('core','core',CORE.length,'EFE Core','Built entirely by the EFE team.')}${k('joint','joint',JOINT.length,'EFE Joint <span class="star">*</span>','Co-built with partner teams who share the benchmark.')}</div>`;
}
function grid(withTools){
  const q=query.trim().toLowerCase();
  const list=B.filter(b=>(filter==='all'||b.area===filter)&&(kind==='all'||(kind==='joint')===b.shared)&&(!q||b.name.toLowerCase().includes(q)||b.code.toLowerCase().includes(q)));
  const tools=withTools?`<div class="toolbar"><div class="chips">${[['all','All areas'],...DATA.areas.map(a=>[a.id,a.name])].map(([k,l])=>`<button class="chip ${filter===k?'on':''}" data-act="filter" data-v="${k}">${esc(l)}</button>`).join('')}</div></div>
    <div class="toolbar"><input class="search" type="search" placeholder="Search ${B.length} benchmarks" value="${esc(query)}" data-input="q" aria-label="Search benchmarks"></div>`:'';
  const groups=DATA.areas.map(a=>({a,items:list.filter(b=>b.area===a.id)})).filter(g=>g.items.length);
  return kindCards()+tools+(groups.length?groups.map(({a,items})=>`<div class="area"><div class="area-head c" style="--c:${AREA[a.id].col}"><span class="sq"></span><h3>${esc(a.name)}</h3><span class="cnt">${items.length}</span></div>
    <div class="bgrid">${items.map(b=>`<a class="bcard c ${b.shared?'joint':'core'}" style="${cvar(b)}" href="#/b/${b.slug}">${badge(b)}<span class="nm">${esc(b.name)}${star(b)}</span><span class="kt">${b.shared?'JOINT *':'CORE'}</span></a>`).join('')}</div></div>`).join('')
    :'<div class="empty">No benchmark matches.</div>');
}

/* ---------- scoring diagram ---------- */
function diagram(){
  const L=[['01','Inputs','The files, tools and context an expert would have.'],['02','Stages','Each step is checked as the agent works.'],['03','Rubric','30+ weighted items give partial credit.'],['04','Verdict','The final output passes or fails.']];
  const win=(x)=>`<g transform="translate(${x},0)"><rect x="0" y="20" width="430" height="380" rx="6" fill="var(--surface2)" stroke="var(--line)"/><path d="M0 52H430" stroke="var(--line)"/><circle cx="18" cy="36" r="4" fill="var(--line)"/><circle cx="32" cy="36" r="4" fill="var(--line)"/><circle cx="46" cy="36" r="4" fill="var(--line)"/>
   <text x="24" y="86" font-family="var(--mono)" font-size="12" fill="var(--muted)">TASK · EFE-CHIP</text>
   <text x="24" y="112" font-family="var(--head)" font-size="19" fill="var(--ink)">Close timing on a failing block</text>
   ${[0,1,2].map(i=>`<rect x="24" y="${134+i*16}" width="${[360,320,250][i]}" height="7" rx="3.5" fill="var(--line)"/>`).join('')}
   ${[0,1,2,3].map(i=>`<rect x="${24+i*98}" y="206" width="86" height="54" rx="4" fill="var(--surface)" stroke="var(--line)"/><rect x="${36+i*98}" y="222" width="${40+i*8}" height="6" rx="3" fill="var(--line)"/><rect x="${36+i*98}" y="236" width="30" height="6" rx="3" fill="var(--line)"/>`).join('')}
   ${[0,1,2,3,4].map(i=>`<rect x="24" y="${294+i*11}" width="${[300,280,330,260,310][i]}" height="6" rx="3" fill="var(--line)"/>`).join('')}
   <rect x="300" y="364" width="106" height="28" rx="14" fill="var(--ink)"/><text x="353" y="383" text-anchor="middle" font-family="var(--sans)" font-size="12" fill="var(--bg)">Submit</text></g>`;
  const boxes=[[16,74,410,98],[16,198,410,66],[16,284,342,62],[292,358,122,38]];
  const ys=[100,190,280,370];
  const desk=`<svg class="desk" viewBox="0 0 1000 410" width="100%" role="img" aria-label="How an EFE task is scored">${win(0)}
    ${boxes.map(([x,y,w,h],i)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--anno-soft)" stroke="var(--anno)" stroke-width="1.5"/><rect x="${x}" y="${y-16}" width="26" height="16" fill="var(--anno)"/><text x="${x+13}" y="${y-4}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="#fff">${L[i][0]}</text>
      <path d="M${x+w} ${y+h/2} C${x+w+80} ${y+h/2} ${560} ${ys[i]} ${600} ${ys[i]}" stroke="var(--anno)" stroke-width="1.2" fill="none"/><circle cx="600" cy="${ys[i]}" r="3.5" fill="var(--anno)"/>
      <text x="620" y="${ys[i]-4}" font-family="var(--head)" font-size="22" fill="var(--ink)">${L[i][1]}</text><text x="620" y="${ys[i]+18}" font-family="var(--sans)" font-size="14" fill="var(--muted)">${L[i][2]}</text>`).join('')}</svg>`;
  const mob=`<svg class="mob" viewBox="0 0 440 410" width="100%" aria-hidden="true">${win(5)}${boxes.map(([x,y,w,h],i)=>`<rect x="${x+5}" y="${y}" width="${w}" height="${h}" fill="var(--anno-soft)" stroke="var(--anno)" stroke-width="1.5"/><rect x="${x+5}" y="${y-18}" width="30" height="18" fill="var(--anno)"/><text x="${x+20}" y="${y-5}" text-anchor="middle" font-family="var(--mono)" font-size="11" fill="#fff">${L[i][0]}</text>`).join('')}</svg>
   <div class="dlist">${L.map(([n,t,d])=>`<div style="display:flex;gap:12px;align-items:flex-start"><span class="atag" style="position:static">${n}</span><div><b style="font-family:var(--head);font-weight:500;font-size:17px">${t}</b><div class="muted" style="font-size:14px">${d}</div></div></div>`).join('')}</div>`;
  return`<div class="diagram">${desk}${mob}</div>`;
}

  return`<div class="lb"><div class="lb-top"><div><div class="eyebrow">Leaderboard · preview</div><h3 style="font-size:24px;margin-top:6px">Every major model, every field</h3></div><div class="tabs"><span class="on">Pass rate</span><span>Rubric score</span><span>By field</span></div></div>

}

function benchPage(slug){
  const b=BY[slug];if(!b)return home();
  const a=AREA[b.area];const i=B.indexOf(b);const prev=B[(i-1+B.length)%B.length],next=B[(i+1)%B.length];
  const secs=[['overview','Overview'],['paper','Paper'],['examples','Task examples'],['taxonomy','Taxonomy'],['team','Team & contributors']];
  const overview=b.description?`<div class="real"><p style="margin:0;font-size:16px;color:var(--ink2)">${esc(b.description)}</p></div>`
    :`<div class="ph">${PH}<p style="margin:12px 0 4px;color:var(--ink2)">A short summary of what <b>${esc(b.name)}</b> covers, who the experts are, and what makes the work hard for AI agents.</p><div class="skel" style="width:92%"></div><div class="skel" style="width:76%"></div></div>`;
  const p=b.paper;
  const paper=`<div class="${p?'real':'ph'} paper"><div class="cover">PDF</div><div>${p?'':PH}
    <h3 style="margin-top:${p?0:12}px">${esc(p&&p.title||`EFE-${b.code}: ${b.name} benchmark`)}</h3>
    <p class="muted" style="margin:6px 0 0">${esc(p&&p.authors||'Authors to be announced')} · ${esc(p&&p.venue||'In preparation')}</p>
    <div class="btns">${[['arXiv',p&&p.arxiv],['PDF',p&&p.pdf],['Code & data',p&&p.code],['BibTeX',p&&p.bibtex]].map(([l,u])=>u?`<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`:`<span class="btn sm" aria-disabled="true">${l}</span>`).join('')}</div></div></div>`;
  const ex=(b.examples&&b.examples.length?b.examples:[{title:b.example}]).slice(0,3);while(ex.length<3)ex.push(null);
  const tasks=`<div class="tgrid">${ex.map((t,k)=>{const real=t&&t.steps;return`<div class="${real?'real':'ph'} tcard">${thumb(b)}<div class="tin"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">${badge(b)}${real?'':PH}</div>
     <h4>${t?esc(t.title):'Example task '+(k+1)}</h4>${real?`<ol>${t.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="meta">${(t.meta||[]).map(m=>`<span>${esc(m)}</span>`).join('')}</div>`
     :`<ol><li>What the expert is given</li><li>The steps the agent must carry out</li><li>How the result is checked</li></ol><div class="meta"><span>stages: –</span><span>rubric: 30+</span><span>split: public</span></div>`}</div></div>`}).join('')}</div>`;
  const tx=b.taxonomy;
  const taxonomy=tx&&tx.length?`<div class="tax">${tx.map(d=>`<div class="real tax-dir"><h4>${esc(d.direction)}<span class="mono muted" style="font-size:11.5px">${d.categories.length}</span></h4><div class="cats">${d.categories.map(c=>`<span class="cat">${esc(c)}</span>`).join('')}</div></div>`).join('')}</div>`
    :`<div class="tax">${[0,1,2,3].map(k=>`<div class="ph tax-dir"><h4>Direction ${k+1}${k?'':PH}</h4><div class="cats">${Array.from({length:6+k%3},()=>'<span class="cat sk">·</span>').join('')}</div></div>`).join('')}</div>
     <p class="muted" style="font-size:13.5px;margin:12px 0 0">Each benchmark is organized into 80–150 task categories, grounded in research papers and industry practice.</p>`;
  const tm=b.team||{};
  const people=(arr,role)=>arr&&arr.length?arr.map(n=>`<div class="person"><span class="av">${esc(String(n).split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase())}</span><div><div class="nm">${esc(n)}</div><div class="rl">${role}</div></div></div>`).join('')
    :`<div class="person"><span class="av"></span><div><div class="nm muted">To be announced</div><div class="rl">${role}</div></div></div>`;
  const has=x=>x&&x.length;
  const team=`<div class="team">
    <div class="${has(tm.leads)?'real':'ph'}"><div class="eyebrow">Benchmark lead</div>${people(tm.leads,'Lead')}</div>
    <div class="${has(tm.members)?'real':'ph'}"><div class="eyebrow">${b.shared?'Partner team':'EFE team'}</div>${people(tm.members,b.shared?'Partner':'Team member')}</div>
    <div class="${has(tm.contributors)?'real':'ph'}"><div class="eyebrow">Task contributors</div>${people(tm.contributors,'Contributor')}<a class="btn sm" style="margin-top:16px" href="#/contribute">Become a contributor</a></div></div>`;
  return header('b')+`<section class="gridbg" style="padding:48px 0 0;border-bottom:1px solid var(--line2)"><div class="container">
   <a class="crumb" href="#/benchmarks">← All benchmarks</a>

   <nav class="subnav" aria-label="Sections">${secs.map(([id,l])=>`<button class="chip" data-act="jump" data-v="${id}">${l}</button>`).join('')}</nav>
  </div></section>
  <div class="container" style="padding-bottom:40px">
   <div class="bsec" id="overview"><h2>Overview</h2>${overview}</div>
   <div class="bsec" id="paper"><h2>Paper</h2>${paper}</div>
   <div class="bsec" id="examples"><h2>Task examples</h2>${tasks}</div>
   <div class="bsec" id="taxonomy"><h2>Taxonomy</h2>${taxonomy}</div>
   <div class="bsec" id="team"><h2>Team &amp; contributors</h2>${team}</div>
   <div class="pn"><a href="#/b/${prev.slug}"><div class="eyebrow">← Previous</div><div style="font-weight:500;margin-top:6px">${esc(prev.name)}${star(prev)}</div></a><a class="r" href="#/b/${next.slug}"><div class="eyebrow">Next →</div><div style="font-weight:500;margin-top:6px">${esc(next.name)}${star(next)}</div></a></div>
  </div>`+foot();
}

   <div class="features" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">
    <div class="feat"><div class="num">01</div><h4>Pass rate</h4><p>Share of runs where the agent fully completes the task.</p></div>
    <div class="feat"><div class="num">02</div><h4>Rubric score</h4><p>Weighted share of 30+ rubric items met, scored stage by stage (0–100).</p></div>
    <div class="feat"><div class="num">03</div><h4>Versioned releases</h4><p>Scores are tied to a benchmark version so results stay comparable as tasks rotate.</p></div>
   </div></div></section>`+foot();
}

function formLinks(){
  const u=(CONFIG.googleFormUrl||'').trim();if(!u)return null;
  const embeddable=/^https:\/\/docs\.google\.com\/forms\//.test(u);
  return{open:u,embed:embeddable?u.replace(/\/(edit|viewform)?(\?.*)?(#.*)?$/,'/viewform')+'?embedded=true':null};
}
function contribute(){
  const f=formLinks();
  const mail=`<a href="mailto:${esc(CONFIG.contactEmail)}?subject=${encodeURIComponent('EFE task proposal')}">${esc(CONFIG.contactEmail)}</a>`;
  const formCard=f?`<div class="card">
     <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:6px"><h3>Submit a task proposal</h3><a class="btn sm" href="${esc(f.open)}" target="_blank" rel="noopener">Open in a new tab ↗</a></div>
     <p class="muted" style="font-size:14px;margin:0 0 16px">Describe the workflow first. The EFE team will follow up with the Harbor template.</p>
     ${f.embed?`<iframe class="gform" src="${esc(f.embed)}" style="height:${Number(CONFIG.googleFormHeight)||1100}px" title="EFE task proposal form" loading="lazy">Loading…</iframe>`:`<a class="btn dark" href="${esc(f.open)}" target="_blank" rel="noopener">Open the proposal form ↗</a>`}
     <p class="muted" style="font-size:13px;margin:14px 0 0">Form not loading? Email your proposal to ${mail} instead.</p></div>`
   :`<div class="card"><h3>Submit a task proposal</h3><p class="muted" style="font-size:14px;margin:6px 0 0">Email a short description of the workflow to ${mail}.</p></div>`;
  return header('c')+`<section class="block gridbg" style="padding:64px 0 40px;border-bottom:1px solid var(--line2)"><div class="container">
   <div class="eyebrow">Contribute</div><h1 class="h-sec" style="margin-top:12px">Help build EFE</h1><p class="muted" style="font-size:16px;margin:14px 0 0">Contributors are credited in the benchmark paper and on this site.</p>
  </div></section>
  <section class="block" style="padding-top:40px"><div class="container"><div class="split">${formCard}
    <div style="display:grid;gap:16px;align-content:start">
     ${DATA.seeking.length?`<div class="card"><h3>New fields looking for an expert partner</h3><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${DATA.seeking.map(n=>`<span class="tag joint">${esc(n)}</span>`).join('')}</div></div>`
       :`<div class="card"><h3>Don’t see your field?</h3><p class="muted" style="font-size:14px;margin:8px 0 0">We welcome new fields. Propose one with the form, and tell us what experts in your field do day to day.</p></div>`}
     <div class="card"><h3>What makes a good task</h3><ul class="rules">${DATA.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
    </div></div></div></section>`+foot();
}

/* ---------- router & events ---------- */
function route(){return location.hash||'#/'}
function render(){
  const h=route();let html;
  if(h.startsWith('#/b/'))html=benchPage(decodeURIComponent(h.slice(4)));
  else if(h==='#/benchmarks')html=allPage();
  else if(h==='#/leaderboard')html=leaderboard();
  else if(h==='#/contribute')html=contribute();
  else html=home();
  document.getElementById('root').innerHTML=html;
  const b=h.startsWith('#/b/')&&BY[decodeURIComponent(h.slice(4))];
  document.title=b?`${b.name} · Experts’ First Exam`:'Experts’ First Exam';
}
const refreshGrid=()=>{const w=document.getElementById('gridwrap');if(w)w.innerHTML=grid(route()==='#/benchmarks')};
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/')||!location.hash){render();window.scrollTo(0,0)}});
document.addEventListener('click',e=>{
  const hdr=document.getElementById('hdr');
  if(hdr&&hdr.classList.contains('open')&&!e.target.closest('[data-act=menu]')&&!e.target.closest('.mpanel'))hdr.classList.remove('open');
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,v=a.dataset.v;
  if(act==='theme'){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('efe-theme',r.dataset.theme)}catch(err){}}
  else if(act==='menu'){hdr.classList.toggle('open')}
  else if(act==='barclose'){try{localStorage.setItem('efe-bar-off','1')}catch(err){}a.parentElement.remove()}
  else if(act==='jump'){e.preventDefault();const el=document.getElementById(v);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(act==='filter'){filter=v;refreshGrid()}
  else if(act==='kind'){kind=v;refreshGrid()}
});
document.addEventListener('input',e=>{if(e.target.dataset.input==='q'){query=e.target.value;const pos=e.target.selectionStart;refreshGrid();const i=document.querySelector('[data-input=q]');if(i){i.focus();i.setSelectionRange(pos,pos)}}});
try{const t=localStorage.getItem('efe-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
render();
</script>
</body>
</html>
